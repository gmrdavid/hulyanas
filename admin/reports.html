<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports & Analytics - Hulyanas Hill</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Exact same styles as dashboard */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            line-height: 1.6;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid #1a1a1a;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 1rem 0;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a1a;
            gap: 0.75rem;
            text-decoration: none;
        }

        .nav-logo i {
            color: #000;
            font-size: 1.8rem;
        }

        .admin-logo i {
            color: #1a1a1a;
            background: #f0f0f0;
            padding: 0.5rem;
            border-radius: 12px;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-menu a {
            text-decoration: none;
            color: #4a4a4a;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            position: relative;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            background: #1a1a1a;
            color: #fff;
        }

        .btn-logout {
            background: #1a1a1a !important;
            color: #fff !important;
            padding: 0.75rem 2rem !important;
            border-radius: 12px;
            font-weight: 600;
        }

        .btn-logout:hover {
            background: #000 !important;
            transform: translateY(-1px);
        }

        .admin-dashboard {
            max-width: 1400px;
            margin: 0 auto;
            padding: 140px 2rem 2rem;
        }

        /* Stats Grid - Exact dashboard match */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .stat-card {
            background: #fff;
            border: 1px solid #e5e5e5;
            padding: 2.5rem;
            border-radius: 20px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #1a1a1a, #333);
        }

        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            border-color: #d0d0d0;
        }

        .stat-icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            color: #1a1a1a;
            opacity: 0.8;
        }

        .stat-number {
            font-size: 2.75rem;
            font-weight: 700;
            color: #000;
            margin-bottom: 0.5rem;
            font-feature-settings: 'tnum' 1;
        }

        .stat-change {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .stat-change.positive { color: #28a745; }
        .stat-change.negative { color: #dc3545; }

        .stat-label {
            font-size: 1rem;
            color: #666;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .admin-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 3rem;
        }

        .content-header {
            margin-bottom: 2rem;
        }

        .content-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1a1a1a;
        }

        .reports-section {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .filter-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-select {
            padding: 0.875rem 1.25rem;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            font-size: 0.95rem;
            background: #fff;
            font-family: inherit;
            font-weight: 500;
            min-width: 140px;
            transition: all 0.2s ease;
        }

        .filter-select:focus {
            outline: none;
            border-color: #1a1a1a;
            box-shadow: 0 0 0 3px rgba(26,26,26,0.1);
        }

        .analytics-table {
            width: 100%;
            border-collapse: collapse;
        }

        .analytics-table th,
        .analytics-table td {
            padding: 1.25rem 1rem;
            text-align: left;
            border-bottom: 1px solid #f5f5f5;
        }

        .analytics-table th {
            font-weight: 600;
            color: #1a1a1a;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .analytics-table tr:hover {
            background: #f8f8f8;
        }

        .rank-badge {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .metric-badge {
            padding: 0.5rem 1rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .metric-sales { background: #e3f2fd; color: #1976d2; }
        .metric-growth { background: #e8f5e8; color: #2e7d32; }

        .activity-feed {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 20px;
            padding: 2.5rem;
            height: fit-content;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .download-section {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 20px;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            margin-top: 2rem;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            margin: 0 0.5rem 1rem;
        }

        .download-btn:hover {
            background: #000;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        @media (max-width: 1024px) {
            .admin-content {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .admin-dashboard {
                padding: 120px 1rem 2rem;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
            }

            .filter-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-select {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        .loading { 
            opacity: 0.6; pointer-events: none; 
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="nav-logo admin-logo">
                <i class="fas fa-user-shield"></i>
                <span>Admin Panel</span>
            </a>
            <ul class="nav-menu">
                <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="menu-manage.html"><i class="fas fa-utensils"></i> Menu</a></li>
                <li><a href="orders.html"><i class="fas fa-list"></i> Orders</a></li>
                <li><a href="users.html"><i class="fas fa-users"></i> Users</a></li>
                <li><a href="reports.html" class="active"><i class="fas fa-chart-bar"></i> Reports</a></li>
                <li><a href="/index.html" id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="admin-dashboard">
        <!-- Key Metrics - Exact dashboard styling -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-shopping-cart"></i></div>
                <div class="stat-number" id="totalOrders" data-target="0">0</div>
                <div class="stat-change positive" id="ordersChange">+0%</div>
                <div class="stat-label">Total Orders</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-peso-sign"></i></div>
                <div class="stat-number" id="totalRevenue" data-target="0">₱0</div>
                <div class="stat-change positive" id="revenueChange">+0%</div>
                <div class="stat-label">Total Revenue</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-users"></i></div>
                <div class="stat-number" id="activeCustomers" data-target="0">0</div>
                <div class="stat-change positive" id="customersChange">+0%</div>
                <div class="stat-label">Active Customers</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-star"></i></div>
                <div class="stat-number" id="avgRating" data-target="0">0</div>
                <div class="stat-change positive" id="ratingChange">+0</div>
                <div class="stat-label">Avg Rating</div>
            </div>
        </div>

        <div class="admin-content">
            <!-- Main Reports Section -->
            <div class="reports-section">
                <div class="content-header">
                    <h1 class="section-title">Analytics Reports</h1>
                    <div class="filter-controls">
                        <select id="reportFilter" class="filter-select">
                            <option value="all">All Products</option>
                            <option value="product">Products</option>
                            <option value="category">Categories</option>
                        </select>
                    </div>
                </div>

                <table class="analytics-table" id="topPerformers">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Item</th>
                            <th>Sales</th>
                            <th>Revenue</th>
                            <th>Growth</th>
                        </tr>
                    </thead>
                    <tbody id="performersBody">
                        <!-- Dynamic content -->
                    </tbody>
                </table>

                <div class="download-section">
                    <h3 style="font-size:1.25rem;font-weight:600;color:#1a1a1a;margin-bottom:1rem;">
                        <i class="fas fa-download"></i> Export Reports
                    </h3>
                    <div>
                        <button class="download-btn" onclick="exportReport('sales')">
                            <i class="fas fa-file-pdf"></i> Sales Report
                        </button>
                        <button class="download-btn" onclick="exportReport('revenue')">
                            <i class="fas fa-file-excel"></i> Revenue Report
                        </button>
                    </div>
                </div>
            </div>

            <!-- Activity Feed - Same as dashboard -->
            <div class="activity-feed">
                <h1 class="section-title">Recent Analytics</h1>
                <div id="analyticsActivity">
                    <!-- Dynamic content -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sample data matching Hulyanas Hill theme
        const analyticsData = [
            { rank: 1, name: 'Adobo Rice Bowl', type: 'product', sales: 324, revenue: 12450, growth: '+28%' },
            { rank: 2, name: 'Chicken Inasal', type: 'product', sales: 289, revenue: 9876, growth: '+15%' },
            { rank: 3, name: 'Halo-Halo Special', type: 'product', sales: 267, revenue: 5340, growth: '+42%' },
            { rank: 4, name: 'Crispy Lumpia', type: 'product', sales: 245, revenue: 3675, growth: '+8%' },
            { rank: 5, name: 'Main Courses', type: 'category', sales: 1234, revenue: 28450, growth: '+19%' },
            { rank: 6, name: 'Desserts', type: 'category', sales: 567, revenue: 8905, growth: '+33%' }
        ];

        const activityItems = [
            { type: 'analytics', message: 'Sales report generated', time: '2 min ago' },
            { type: 'export', message: 'Revenue data exported to PDF', time: '5 min ago' },
            { type: 'peak', message: 'New peak sales day detected', time: '12 min ago' },
            { type: 'growth', message: 'Desserts category +33% growth', time: '1 hr ago' }
        ];

        // Animate counters (same as dashboard)
        function animateCounters(data) {
            const elements = [
                { el: 'totalOrders', target: data.totalOrders, format: 'number' },
                { el: 'totalRevenue', target: data.totalRevenue, format: 'currency' },
                { el: 'activeCustomers', target: data.activeCustomers, format: 'number' },
                { el: 'avgRating', target: data.avgRating, format: 'decimal' }
            ];

            elements.forEach(({ el, target, format }) => {
                const element = document.getElementById(el);
                let current = 0;
                const increment = target / 50;
                const timer = setInterval(() => {
                    current += increment;
                    if (current >= target) {
                        if (format === 'currency') {
                            element.textContent = `₱${target.toLocaleString('en-PH', { minimumFractionDigits: 0 })}`;
                        } else if (format === 'decimal') {
                            element.textContent = target.toFixed(1);
                        } else {
                            element.textContent = Math.floor(target).toLocaleString();
                        }
                        clearInterval(timer);
                        return;
                    }
                    const display = format === 'currency' ? `₱${Math.floor(current).toLocaleString()}` :
                                  format === 'decimal' ? current.toFixed(1) : Math.floor(current).toLocaleString();
                    element.textContent = display;
                }, 20);
            });
        }

        // Load analytics data
        async function loadAnalyticsData() {
            try {
                // Simulate API response
                const data = {
                    totalOrders: 1247,
                    totalRevenue: 24567.89,
                    activeCustomers: 892,
                    avgRating: 4.8
                };
                
                document.querySelectorAll('.stat-number').forEach(el => {
                    el.setAttribute('data-target', data[el.id.replace('total', '').toLowerCase()] || 0);
                });
                
                animateCounters(data);
            } catch (error) {
                console.error('Analytics error:', error);
            }
        }

        // Render top performers table
        function renderTopPerformers(data) {
            const tbody = document.getElementById('performersBody');
            tbody.innerHTML = data.slice(0, 8).map(item => `
                <tr>
                    <td><div class="rank-badge">${item.rank}</div></td>
                    <td>
                        <div style="font-weight:600;">${item.name}</div>
                        <div style="color:#666;font-size:0.85rem;">${item.type}</div>
                    </td>
                    <td><span class="metric-badge metric-sales">${item.sales.toLocaleString()}</span></td>
                    <td><strong>₱${(item.revenue/1000).toLocaleString('en-PH', {minimumFractionDigits: 0, maximumFractionDigits: 0})}K</strong></td>
                    <td><span class="metric-badge metric-growth">${item.growth}</span></td>
                </tr>
            `).join('');
        }

        // Load activity feed (same as dashboard)
        function loadActivityFeed() {
            const feed = document.getElementById('analyticsActivity');
            feed.innerHTML = activityItems.map(activity => `
                <div class="activity-item">
                    <div class="activity-icon ${activity.type}">
                        <i class="fas fa-${activity.type === 'analytics' ? 'chart-bar' : 
                            activity.type === 'export' ? 'file-export' : 
                            activity.type === 'peak' ? 'trophy' : 'chart-line'}"></i>
                    </div>
                    <div class="activity-content">
                        <h4>${activity.message}</h4>
                        <p>${activity.time}</p>
                    </div>
                </div>
            `).join('');
        }

        // Filter handler
        document.getElementById('reportFilter').addEventListener('change', (e) => {
            const filtered = e.target.value === 'all' ? analyticsData : 
                           analyticsData.filter(item => item.type === e.target.value);
            renderTopPerformers(filtered);
        });

        // Export functions
        function exportReport(type) {
            const types = {
                sales: 'Sales Report',
                revenue: 'Revenue Report'
            };
            showToast(`📊 ${types[type] || 'Report'} exported successfully!`);
        }

        // Toast notification (same as dashboard)
        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position:fixed;top:20px;right:20px;background:#d4edda;color:#155724;
                padding:1rem 2rem;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.1);
                z-index:3000;transform:translateX(400px);transition:all 0.3s ease;font-weight:500;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.style.transform = 'translateX(0)', 100);
            setTimeout(() => toast.remove(), 3000);
        }

        // Navbar scroll effect (same as dashboard)
        window.addEventListener('scroll', () => {
            const navbar = document.querySelector('.navbar');
            navbar.style.background = window.scrollY > 50 ? 'rgba(255,255,255,1)' : 'rgba(255,255,255,0.98)';
        });

        // Logout handler (same as dashboard)
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('token');
                window.location.href = '/index.html';
            }
        });

        // 🚀 MAIN INITIALIZATION (same as dashboard)
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('📊 Loading Hulyanas Reports Dashboard...');
            
            // Auto-login if no token
            if (!localStorage.getItem('token')) {
                try {
                    const loginRes = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: 'admin', password: 'password' })
                    }); 
                    const loginData = await loginRes.json();
                    localStorage.setItem('token', loginData.token);
                } catch (e) {
                    console.log('ℹ️ No auto-login available');
                }
            }

            document.body.classList.add('loading');
            
            // Load in parallel
            await Promise.all([
                loadAnalyticsData(),
                new Promise(resolve => setTimeout(() => {
                    renderTopPerformers(analyticsData);
                    loadActivityFeed();
                    resolve();
                }, 500))
            ]);
            
            document.body.classList.remove('loading');
            console.log('✅ Reports Dashboard loaded! ✨');
        });
    </script>
</body>
</html>
