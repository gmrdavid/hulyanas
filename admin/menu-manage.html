<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Management - Hulyanas Hill</title>
    <link rel="stylesheet" href="css/menu-manage.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
   
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="nav-logo admin-logo">
                <i class="fas fa-user-shield"></i>
                <span>Admin Panel</span>
            </a>
            <ul class="nav-menu">
                <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="menu-manage.html" class="active"><i class="fas fa-utensils"></i> Menu</a></li>
                <li><a href="orders.html"><i class="fas fa-list"></i> Orders</a></li>
                <li><a href="users.html"><i class="fas fa-users"></i> Users</a></li>
                <li><a href="reports.html"><i class="fas fa-chart-bar"></i> Reports</a></li>
                <li><a href="#" id="adminLogout" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="admin-content">
        <div class="content-header">
            <h1>Menu Management</h1>
            <button class="btn btn-primary" onclick="showAddModal()">
                <i class="fas fa-plus"></i>
                Add New Item
            </button>
        </div>

        <div class="menu-controls">

        <div class="filter-group">
            <label>Filter Category:</label>

            <select id="categoryFilter">
                <option value="all">All Categories</option>
                <option value="drinks">Drinks</option>
                <option value="pizza">Pizza</option>
                <option value="pasta">Pasta</option>
                <option value="fries">Fries</option>
                <option value="chips">Chips</option>
                <option value="bfast">All Day Breakfast</option>
                <option value="meal">Meals</option>
            </select>
        </div>
    </div>

        <div class="table-container">
            <table class="menu-table" id="menuTable">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="menuItems">
                    <!-- Dynamic content -->
                </tbody>
            </table>
                <div class="pagination-controls">

                <button id="prevBtn" class="pagination-btn">
                    <i class="fas fa-chevron-left"></i>
                    Previous
                </button>

                <span id="pageInfo">
                    Page 1
                </span>

                <button id="nextBtn" class="pagination-btn">
                    Next
                    <i class="fas fa-chevron-right"></i>
                </button>

        </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="menuModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="hideMenuModal()">&times;</span>
            <h2 id="modalTitle">Add New Menu Item</h2>
            <form id="menuForm">
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" id="itemName" placeholder="e.g. Margherita Pizza" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="itemDescription" rows="3" placeholder="Delicious description of your menu item..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Price *</label>
                        <input type="number" id="itemPrice" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label>Category *</label>
                        <select id="itemCategory" required>
                            <option value="drinks">Drinks</option>
                            <option value="pizza">Pizza</option>
                            <option value="pasta">Pasta</option>
                            <option value="fries">Fries</option>
                            <option value="chips">Chips</option>
                            <option value="bfast">All Day Breakfast</option>
                            <option value="meal">Meals</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Image</label>
                    <input type="file" id="itemImage" accept="image/*">
                    <img id="imagePreview" class="image-preview" style="display: none;">
                </div>
                <div class="form-group">
                    <label>Status *</label>
                    <select id="itemStatus" required>
                        <option value="available">Available</option>
                        <option value="unavailable">Unavailable</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Item</button>
                    <button type="button" class="btn btn-secondary" onclick="hideMenuModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/menu-manage.js"></script>
</body>
</html>
