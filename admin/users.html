<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Hulyanas Hill Admin</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>

        body {

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;

        }

        .modal {
            background: #fff;
            border-radius: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.3);
            transform: translateY(-50px);
            transition: all 0.3s ease;
            position: relative;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            padding: 2rem 2.5rem 1.5rem;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1a1a1a;
        }

        .modal-close {

            height: 44px;
            border-radius: 12px;
            background: #f0f0f0;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            color: #666;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: #e0e0e0;
            color: #1a1a1a;
        }

        .modal-body {
            padding: 2rem 2.5rem;
        }

        .modal-section {
            margin-bottom: 2rem;
        }

        .modal-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .user-avatar-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a1a, #333);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 1rem 1.25rem;
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            font-size: 1rem;
            background: #fff;

        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #1a1a1a;
            box-shadow: 0 0 0 3px rgba(26, 26, 26, 0.1);
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            padding-top: 1.5rem;
            border-top: 1px solid #f0f0f0;
            margin-top: 2rem;
        }

        .btn {
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: #1a1a1a;
            color: #fff;
        }

        .btn-primary:hover {
            background: #000;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #666;
            border: 2px solid #e0e0e0;
        }

        .btn-secondary:hover {

        .user-details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .user-details-grid {
                grid-template-columns: 1fr;

        /* Navbar Styles */
        .navbar {
            background: rgba(255, 255, 255, 0.98);

            border-bottom: 2px solid #1a1a1a;
            position: fixed;
            top: 0;

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;

            justify-content: space-between;
            align-items: center;

        }

        .nav-logo {
            display: flex;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a1a;
            gap: 0.75rem;

        }

        .nav-logo i {
            color: #000;
            font-size: 1.8rem;
        }

        .admin-logo i {
            color: #1a1a1a;

            padding: 0.5rem;
            border-radius: 12px;
        }

        .nav-menu {
            display: flex;

            gap: 1.5rem;

        }

        .nav-menu a {
            text-decoration: none;

        }

        .page-stats {

            gap: 2rem;

        .stat-card {

            width: 48px;

            align-items: center;

        .stat-info h3 {

            color: #000;
            margin-bottom: 0.25rem;
        }

        .stat-info p {
            color: #666;
            font-size: 0.9rem;
        }

        .content-header {

            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;

        }

        .content-header h1 {
            font-size: 2.5rem;
            font-weight: 700;

        }

        .search-filter {
            display: flex;
            gap: 1rem;
            align-items: center;

        .search-input {
            padding: 1rem 1.5rem;

            border-radius: 16px;
            font-size: 1rem;

            padding: 1rem 1.5rem;

            font-size: 1rem;

        }

        .table-container {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);

        .users-table {
            width: 100%;

        .users-table thead {

        .users-table th {

            font-weight: 600;

            font-size: 0.9rem;

        }

        .users-table td {
            padding: 2rem 1.7rem;
            border-bottom: 1px solid #f5f5f5;
            vertical-align: middle;
        }

        .users-table tr:hover {
            background: #f8f8f8;
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a1a, #333);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1rem;
            margin-right: 1rem;
        }

        .user-info {
            display: flex;
            align-items: center;
        }

        .user-name {
            font-weight: 600;
            color: #1a1a1a;
            font-size: 1.1rem;
        }

        .user-email {
            color: #666;
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .user-role {
            padding: 0.5rem 1.25rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .role-customer { 
            background: #e3f2fd; 
            color: #1976d2; 
            border: 1px solid #bbdefb; 
        }

        .role-admin { 
            background: #fff3e0; 
            color: #ef6c00; 
            border: 1px solid #ffcc80; 
        }

        .role-staff { 
            background: #f3e5f5;

        }

        .table-actions {
            display: flex;
            gap: 0.75rem;
        }

        .action-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s ease;
            border: none;

        .action-view {
            background: #1a1a1a;
            color: #fff;

        .action-view:hover {
            background: #000;
            transform: scale(1.05);
        }

        .action-delete {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .action-delete:hover {
            background: #f5c2c5;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .admin-content {
                padding: 0 1rem;
                margin: 120px 1rem 2rem;
            }

            .content-header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .search-filter {
                width: 100%;
                justify-content: center;
            }

            .search-input {

            }

            .table-actions {

            }

            .page-stats {
                flex-direction: column;
            }

<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="admin-dashboard.html" class="nav-logo admin-logo">
                <i class="fas fa-user-shield"></i>
                <span>Admin Panel</span>
            </a>
            <ul class="nav-menu">
                <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="menu-manage.html"><i class="fas fa-utensils"></i> Menu</a></li>
                <li><a href="orders.html"><i class="fas fa-list"></i> Orders</a></li>
                <li><a href="users.html" class="active"><i class="fas fa-users"></i> Users</a></li>
                <li><a href="reports.html"><i class="fas fa-chart-bar"></i> Reports</a></li>
                <li><a href="#" id="adminLogout" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>

    <div class="admin-content">
        <div class="page-stats">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-info">
                    <h3 id="totalUsers">0</h3>
                    <p>Total Users</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-user-shield"></i>
                </div>
                <div class="stat-info">
                    <h3 id="totalAdmins">0</h3>
                    <p>Admins</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-calendar-plus"></i>
                </div>
                <div class="stat-info">
                    <h3 id="newUsersToday">0</h3>
                    <p>New Today</p>
                </div>
            </div>
        </div>

        <div class="content-header">
            <h1>User Management</h1>
            <div class="search-filter">
                <input type="text" class="search-input" placeholder="Search users..." id="userSearch">
                <select class="filter-select" id="roleFilter">
                    <option value="">All Roles</option>
                    <option value="customer">Customers</option>
                    <option value="admin">Admins</option>
                    <option value="staff">Staff</option>

        <div class="table-container">
            <table class="users-table" id="usersTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>User</th>
                        <th>Email</th>
                        <th>Full Name</th>
                        <th>Phone</th>
                        <th>Role</th>
                        <th>Joined</th>

    <!-- View User Modal -->
    <div class="modal-overlay" id="viewModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="viewModalTitle">User Profile</h2>
                <button class="modal-close" id="viewModalClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-section">
                    <div class="user-avatar-large" id="viewUserAvatar"></div>
                </div>
                <div class="modal-section">
                    <div class="user-details-grid">
                        <div>
                            <label class="form-label">Username</label>
                            <p id="viewUsername" style="font-weight: 600; font-size: 1.1rem; color: #1a1a1a;"></p>
                        </div>
                        <div>
                            <label class="form-label">Email</label>
                            <p id="viewEmail" style="font-size: 1rem; color: #1a1a1a;"></p>
                        </div>
                        <div>
                            <label class="form-label">Full Name</label>
                            <p id="viewFullName" style="font-weight: 500;"></p>
                        </div>
                        <div>
                            <label class="form-label">Phone</label>
                            <p id="viewPhone"></p>
                        </div>
                        <div>
                            <label class="form-label">Role</label>
                            <span id="viewRole" class="user-role"></span>
                        </div>
                        <div>
                            <label class="form-label">Date Joined</label>
                            <p id="viewJoined"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
let users = [];

// Modal functions
function openModal(modalId) {
    const modal = document.getElementById(modalId);
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeModal(modalId) {
    const modal = document.getElementById(modalId);
    modal.classList.remove('active');
    document.body.style.overflow = '';
}

function closeAllModals() {
    closeModal('viewModal');
}

// Safe JSON parser with HTML detection
function safeParseJson(responseText, context = 'API') {
    // Check if it's HTML error page
    if (responseText.includes('<!DOCTYPE') || responseText.includes('<html') || responseText.includes('404') || responseText.includes('500')) {
        console.error(`${context} Response (HTML Error):`, responseText.substring(0, 300));
        throw new Error(`${context} endpoint not found or server error. Check if API exists.`);
    }

    try {
        return JSON.parse(responseText);
    } catch (e) {
        console.error(`${context} Invalid JSON:`, responseText.substring(0, 300));
        throw new Error(`${context} returned invalid response (not JSON)`);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    // Modal close handlers
    document.getElementById('viewModalClose').addEventListener('click', () => closeModal('viewModal'));

    // Overlay click to close
    document.getElementById('viewModal').addEventListener('click', (e) => {
        if (e.target.classList.contains('modal-overlay')) closeModal('viewModal');
    });

    // ESC key to close modals
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeAllModals();
    });

    // Search and filter
    document.getElementById('userSearch').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = users.filter(user => 
            user.username?.toLowerCase().includes(query) ||
            user.email?.toLowerCase().includes(query) ||
            `${user.first_name || ''} ${user.last_name || ''}`.toLowerCase().includes(query)
        );
        renderUsersTable(filtered);
    });

    document.getElementById('roleFilter').addEventListener('change', (e) => {
        const role = e.target.value;
        const filtered = role ? users.filter(user => user.role === role) : users;
        renderUsersTable(filtered);
    });

    // Admin logout
    document.getElementById('adminLogout').addEventListener('click', (e) => {
        e.preventDefault();
        if (confirm('Are you sure you want to logout?')) {
            localStorage.removeItem('token');
            window.location.href = '/index.html';
        }
    });

    fetchUsers();
});

async function fetchUsers() {
    try {
        const token = localStorage.getItem('token');
        if (!token) {
            alert('Please login first');
            window.location.href = '/login.html';
            return;
        }

        console.log('📡 Fetching users...');
        const response = await fetch('https://hulyanas.onrender.com/api/admin/users', {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            }
        });

        const responseText = await response.text();
        console.log('📡 GET Users Response:', {
            status: response.status,
            response: responseText.substring(0, 500)
        });

        if (!response.ok) {
            const data = safeParseJson(responseText, 'GET /api/admin/users');
            throw new Error(data.error || data.message || `HTTP ${response.status}`);
        }

        const data = safeParseJson(responseText, 'GET /api/admin/users');
        users = data;
        renderUsersTable(users);
        console.log('✅ Users loaded:', users.length);

    } catch (error) {
        console.error('❌ fetchUsers error:', error);
        if (error.message.includes('endpoint not found')) {
            alert('🚫 Users API missing. Check server: GET /api/admin/users');
        } else {
            alert(`Failed to load users: ${error.message}`);
        }
    }
}

function renderUsersTable(filteredUsers = users) {
    const tbody = document.getElementById('usersList');
    const totalUsersEl = document.getElementById('totalUsers');
    const totalAdminsEl = document.getElementById('totalAdmins');
    const newUsersTodayEl = document.getElementById('newUsersToday');

    // Stats
    totalUsersEl.textContent = users.length;
    totalAdminsEl.textContent = users.filter(u => u.role === 'admin').length;
    const today = new Date().toDateString();
    newUsersTodayEl.textContent = users.filter(u =>
        new Date(u.created_at).toDateString() === today
    ).length;

    tbody.innerHTML = filteredUsers.map(user => {
        const initials = `${user.first_name?.charAt(0) || ''}${user.last_name?.charAt(0) || ''}`;
        const joinedDate = new Date(user.created_at).toLocaleDateString('en-US', {
            month: 'short',
            day: 'numeric',
            year: 'numeric'
        });

        return `
            <tr>
                <td>#${String(user.id).padStart(4, '0')}</td>
                <td>
                    <div class="user-info">
                        <div class="user-avatar">${initials || 'U'}</div>
                        <div>
                            <div class="user-name">${user.username || 'N/A'}</div>
                            <div class="user-email">${user.email || 'N/A'}</div>
                        </div>
                    </div>
                </td>
                <td>${user.email || '—'}</td>
                <td>${(user.first_name || '') + ' ' + (user.last_name || '')}</td>
                <td>${user.phone || '—'}</td>
                <td>
                    <span class="user-role role-${user.role || 'customer'}">${user.role || 'customer'}</span>
                </td>
                <td class="date-joined">${joinedDate}</td>
                <td>
                    <div class="table-actions">
                        <button class="action-btn action-view" onclick="viewUser(${user.id})" title="View">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="action-btn action-delete" onclick="deleteUser(${user.id})" title="Delete">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </td>
            </tr>
        `;
    }).join('');
}

// View User Modal
function viewUser(id) {
    const user = users.find(u => u.id === id);
    if (!user) {
        alert('User not found');
        return;
    }

    document.getElementById('viewModalTitle').textContent = `User #${user.id}`;
    document.getElementById('viewUserAvatar').textContent = `${user.first_name?.charAt(0) || ''}${user.last_name?.charAt(0) || 'U'}`;
    document.getElementById('viewUsername').textContent = user.username || 'N/A';
    document.getElementById('viewEmail').textContent = user.email || 'N/A';
    document.getElementById('viewFullName').textContent = `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'Not provided';
    document.getElementById('viewPhone').textContent = user.phone || 'Not provided';
    
    const roleEl = document.getElementById('viewRole');
    roleEl.textContent = user.role || 'customer';
    roleEl.className = `user-role role-${user.role || 'customer'}`;
    
    document.getElementById('viewJoined').textContent = user.created_at ? 
        new Date(user.created_at).toLocaleDateString('en-US', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        }) : 'Unknown';

    openModal('viewModal');
}

// Delete User
async function deleteUser(id) {
    if (!confirm('Are you sure you want to delete this user? This action cannot be undone.')) return;

    try {
        const token = localStorage.getItem('token');
        if (!token) {
            alert('No authentication token. Please login again.');
            window.location.href = '/login.html';
            return;
        }

        console.log('🗑️ Deleting user:', id);
        const response = await fetch(`https://hulyanas.onrender.com/api/admin/users/${id}`, {
            method: 'DELETE',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });

        const responseText = await response.text();
        console.log('📡 DELETE Response:', {
            status: response.status,
            response: responseText.substring(0, 300)
        });

        if (!response.ok) {
            const data = safeParseJson(responseText, `DELETE /api/admin/users/${id}`);
            throw new Error(data.error || data.message || `HTTP ${response.status}`);
        }

        const data = safeParseJson(responseText, `DELETE /api/admin/users/${id}`);
        alert('✅ ' + (data.message || 'User deleted successfully'));
        fetchUsers();

    } catch (error) {
        console.error('❌ Delete error:', error);
        if (error.message.includes('endpoint not found')) {
            alert('🚫 DELETE API missing. Check server: DELETE /api/admin/users/:id');
        } else {
            alert(`Delete failed: ${error.message}`);
        }
    }
}
