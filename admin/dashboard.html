<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Hulyanas Hill</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            line-height: 1.6;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid #1a1a1a;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 1rem 0;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a1a;
            gap: 0.75rem;
            text-decoration: none;
        }

        .nav-logo i {
            color: #000;
            font-size: 1.8rem;
        }

        .admin-logo i {
            color: #1a1a1a;
            background: #f0f0f0;
            padding: 0.5rem;
            border-radius: 12px;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-menu a {
            text-decoration: none;
            color: #4a4a4a;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            position: relative;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            background: #1a1a1a;
            color: #fff;
        }

        .btn-logout {
            background: #1a1a1a !important;
            color: #fff !important;
            padding: 0.75rem 2rem !important;
            border-radius: 12px;
            font-weight: 600;
        }

        .btn-logout:hover {
            background: #000 !important;
            transform: translateY(-1px);
        }

        .admin-dashboard {
            max-width: 1400px;
            margin: 0 auto;
            padding: 140px 2rem 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .stat-card {
            background: #fff;
            border: 1px solid #e5e5e5;
            padding: 2.5rem;
            border-radius: 20px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #1a1a1a, #333);
        }

        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            border-color: #d0d0d0;
        }

        .stat-icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            color: #1a1a1a;
            opacity: 0.8;
        }

        .stat-number {
            font-size: 2.75rem;
            font-weight: 700;
            color: #000;
            margin-bottom: 0.5rem;
            font-feature-settings: 'tnum' 1;
        }

        .stat-label {
            font-size: 1rem;
            color: #666;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .admin-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 3rem;
        }

        .content-header {
            margin-bottom: 2rem;
        }

        .content-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1a1a1a;
        }

        .recent-orders-section {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
        }

        .orders-table th,
        .orders-table td {
            padding: 1.25rem 1rem;
            text-align: left;
            border-bottom: 1px solid #f5f5f5;
        }

        .orders-table th {
            font-weight: 600;
            color: #1a1a1a;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .orders-table tr:hover {
            background: #f8f8f8;
        }

        .order-status {
            padding: 0.5rem 1rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending { background: #fff3cd; color: #856404; }
        .status-delivered { background: #d4edda; color: #155724; }
        .status-cancelled { background: #f8d7da; color: #721c24; }

        .quick-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .btn-primary {
            background: #1a1a1a;
            color: #fff;
        }

        .btn-primary:hover {
            background: #000;
        }

        .btn-secondary {
            background: transparent;
            color: #666;
            border: 1px solid #e0e0e0;
        }

        .btn-secondary:hover {
            background: #f0f0f0;
            color: #1a1a1a;
        }

        .btn-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .btn-danger:hover {
            background: #f5c2c5;
        }

        .activity-feed {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 20px;
            padding: 2.5rem;
            height: fit-content;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .activity-item {
            display: flex;
            align-items: center;
            padding: 1.5rem 0;
            border-bottom: 1px solid #f5f5f5;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1.5rem;
            font-size: 1.1rem;
            color: #fff;
        }

        .activity-icon.order { background: #1a1a1a; }
        .activity-icon.user { background: #666; }
        .activity-icon.menu { background: #999; }

        .activity-content h4 {
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 0.25rem;
        }

        .activity-content p {
            color: #666;
            font-size: 0.9rem;
        }

        @media (max-width: 1024px) {
            .admin-content {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .admin-dashboard {
                padding: 120px 1rem 2rem;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
            }

            .nav-menu {
                gap: 1rem;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        .loading { 
            opacity: 0.6; pointer-events: none; 
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="nav-logo admin-logo">
                <i class="fas fa-user-shield"></i>
                <span>Admin Panel</span>
            </a>
            <ul class="nav-menu">
                <li><a href="dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="menu-manage.html"><i class="fas fa-utensils"></i> Menu</a></li>
                <li><a href="orders.html"><i class="fas fa-list"></i> Orders</a></li>
                <li><a href="users.html"><i class="fas fa-users"></i> Users</a></li>
                <li><a href="/index.html" id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="admin-dashboard">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-utensils"></i></div>
                <div class="stat-number" id="menuCount" data-target="0">0</div>
                <div class="stat-label">Menu Items</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-list"></i></div>
                <div class="stat-number" id="orderCount" data-target="0">0</div>
                <div class="stat-label">Total Orders</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-peso-sign"></i></div>
                <div class="stat-number" id="revenueCount" data-target="0">₱0</div>
                <div class="stat-label">Revenue</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-users"></i></div>
                <div class="stat-number" id="userCount" data-target="0">0</div>
                <div class="stat-label">Users</div>
            </div>
        </div>
    </div>

          <!-- FIXED: Moved admin-content INSIDE admin-dashboard -->
        <div class="admin-content">
            <div class="recent-orders-section">
                <h1 class="section-title">Recent Orders</h1>
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>Order #</th>
                            <th>Customer</th>
                            <th>Status</th>
                            <th>Total</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="recentOrders">
                        <!-- Dynamic content -->
                    </tbody>
                </table>
            </div>

            <div class="activity-feed">
                <h1 class="section-title">Activity Feed</h1>
                <div id="activityFeed">
                    <!-- Dynamic content -->
                </div>
            </div>
        </div>
    </div>
</div>

       <script>
        // Animate counters
        function animateCounters(data) {
            const menuEl = document.getElementById('menuCount');
            const orderEl = document.getElementById('orderCount');
            const revenueEl = document.getElementById('revenueCount');
            const userEl = document.getElementById('userCount');

            [menuEl, orderEl, userEl].forEach((el, i) => {
                const targets = [data.menuItems, data.totalOrders, data.totalUsers];
                let current = 0;
                const target = targets[i];
                const increment = target / 50;
                const timer = setInterval(() => {
                    current += increment;
                    if (current >= target) {
                        el.textContent = Math.floor(target).toLocaleString();
                        clearInterval(timer);
                        return;
                    }
                    el.textContent = Math.floor(current).toLocaleString();
                }, 20);
            });

            // Revenue animation
            let currentRev = 0;
            const targetRev = data.revenue;
            const revIncrement = targetRev / 50;
            const revTimer = setInterval(() => {
                currentRev += revIncrement;
                if (currentRev >= targetRev) {
                    revenueEl.textContent = `₱${targetRev.toFixed(2)}`;
                    clearInterval(revTimer);
                    return;
                }
                revenueEl.textContent = `₱${currentRev.toFixed(0)}`;
            }, 20);
        }

        // Load admin stats
        async function loadAdminStats() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/admin/stats', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const data = await response.json();
                
                // Set data-targets and animate
                document.getElementById('menuCount').setAttribute('data-target', data.menuItems);
                document.getElementById('orderCount').setAttribute('data-target', data.totalOrders);
                document.getElementById('revenueCount').setAttribute('data-target', data.revenue);
                document.getElementById('userCount').setAttribute('data-target', data.totalUsers);
                
                animateCounters(data);
                console.log('✅ Stats loaded:', data);
            } catch (error) {
                console.error('Stats error:', error);
            }
        }

        // FIXED: loadRecentOrders with event delegation
        async function loadRecentOrders() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/admin/recent-orders', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const orders = await response.json();
                
                const tbody = document.getElementById('recentOrders');
                if (orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:3rem;color:#999;">No recent orders found</td></tr>';
                    return;
                }
                
                tbody.innerHTML = orders.map(order => `
                    <tr data-order-id="${order.id}">
                        <td>${order.order_number || 'N/A'}</td>
                        <td>${order.customer || 'Unknown'}</td>
                        <td><span class="order-status status-${order.status}">${order.status?.replace('_',' ') || 'Unknown'}</span></td>
                        <td>₱${parseFloat(order.total_amount || 0).toFixed(2)}</td>
                        <td>${order.time_ago || 'N/A'}</td>
                        <td>
                            <div class="quick-actions">
                                <button class="btn btn-primary" data-action="view" data-id="${order.id}" title="View Order">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="btn btn-secondary" data-action="edit" data-id="${order.id}" title="Edit Order">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-danger" data-action="delete" data-id="${order.id}" title="Delete Order">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join('');
                
                // Setup event listeners after population
                setupOrderActions();
                console.log('✅ Orders loaded:', orders.length);
                
            } catch (error) {
                console.error('Orders error:', error);
                document.getElementById('recentOrders').innerHTML = 
                    '<tr><td colspan="6" style="text-align:center;padding:3rem;color:#666;">Failed to load orders. Please refresh.</td></tr>';
            }
        }

        // Activity feed
        async function loadActivityFeed() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/admin/activity', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const activities = await response.json();
                
                const feed = document.getElementById('activityFeed');
                if (activities.length === 0) {
                    feed.innerHTML = '<div style="text-align:center;padding:2rem;color:#999;">No recent activity</div>';
                    return;
                }
                
                feed.innerHTML = activities.map(activity => `
                    <div class="activity-item">
                        <div class="activity-icon ${activity.type}">
                            <i class="fas fa-${activity.type === 'order' ? 'shopping-cart' : 
                                          activity.type === 'user' ? 'user-plus' : 'utensils'}"></i>
                        </div>
                        <div class="activity-content">
                            <h4>${activity.message}</h4>
                            <p>${activity.time}</p>
                        </div>
                    </div>
                `).join('');
                console.log('✅ Activity loaded:', activities.length);
            } catch (error) {
                console.error('Activity error:', error);
                document.getElementById('activityFeed').innerHTML = 
                    '<div style="text-align:center;padding:2rem;color:#666;">Failed to load activity feed</div>';
            }
        }

        // NEW: Centralized event delegation for all order actions
        function setupOrderActions() {
            const tableContainer = document.querySelector('.recent-orders-section');
            
            tableContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-action]');
                if (!btn) return;
                
                const action = btn.dataset.action;
                const orderId = btn.dataset.id;
                
                console.log(`Order action: ${action} #${orderId}`);
                
                switch(action) {
                    case 'view':
                        window.location.href = `/admin/order-details.html?id=${orderId}`;
                        break;
                    case 'edit':
                        window.location.href = `/admin/edit-order.html?id=${orderId}`;
                        break;
                    case 'delete':
                        deleteOrder(orderId);
                        break;
                }
            });
        }

        // FIXED: Robust deleteOrder function
        async function deleteOrder(orderId) {
            if (!confirm('Are you sure you want to delete this order?\nThis action cannot be undone.')) {
                return;
            }
            
            try {
                const token = localStorage.getItem('token');
                document.body.classList.add('loading'); // Visual feedback
                
                const response = await fetch(`/api/admin/orders/${orderId}`, {
                    method: 'DELETE',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    // Success feedback
                    const successMsg = document.createElement('div');
                    successMsg.style.cssText = `
                        position:fixed;top:20px;right:20px;background:#d4edda;color:#155724;
                        padding:1rem 2rem;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.1);
                        z-index:10000;font-weight:500;transform:translateX(400px);transition:all 0.3s ease;
                    `;
                    successMsg.textContent = '✅ Order deleted successfully!';
                    document.body.appendChild(successMsg);
                    
                    setTimeout(() => {
                        successMsg.style.transform = 'translateX(0)';
                    }, 100);
                    
                    setTimeout(() => {
                        successMsg.remove();
                        loadRecentOrders();
                        loadAdminStats();
                    }, 2000);
                    
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.message || 'Delete failed');
                }
            } catch (error) {
                console.error('Delete error:', error);
                alert(`❌ Delete failed: ${error.message}`);
            } finally {
                document.body.classList.remove('loading');
            }
        }

        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            const navbar = document.querySelector('.navbar');
            navbar.style.background = window.scrollY > 50 ? 'rgba(255,255,255,1)' : 'rgba(255,255,255,0.98)';
        });

        // Logout handler
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('token');
                window.location.href = '/index.html';
            }
        });

        // MAIN INITIALIZATION - FIXED sequencing
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🔥 Loading Hulyanas Admin Dashboard...');
            
            // Auto-login if no token (demo mode)
            if (!localStorage.getItem('token')) {
                try {
                    console.log('🔑 Attempting auto-login...');
                    const loginRes = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: 'admin', password: 'password' })
                    });
                    const loginData = await loginRes.json();
                    localStorage.setItem('token', loginData.token);
                    console.log('✅ Auto-login successful');
                } catch (e) {
                    console.log('ℹ️ No auto-login available - using manual login');
                }
            }
            
            // Sequential loading for proper event binding
            document.body.classList.add('loading');
            await loadAdminStats();
            await loadRecentOrders();
            await loadActivityFeed();
            document.body.classList.remove('loading');
            
            console.log('✅ Dashboard fully loaded with real data!');
        });
    </script>
</body>
</html>
