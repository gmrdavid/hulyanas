<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Hulyanas Hill</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* All existing styles remain the same - unchanged */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            min-height: 100vh;
            line-height: 1.6;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid #e5e5e5;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 1rem 0;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a1a;
            gap: 0.75rem;
        }

        .nav-logo i {
            color: #000;
            font-size: 1.8rem;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        .nav-menu a {
            text-decoration: none;
            color: #4a4a4a;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .nav-menu a:hover {
            background: #f0f0f0;
            color: #1a1a1a;
            transform: translateY(-1px);
        }

        .btn-logout {
            background: #1a1a1a !important;
            color: #fff !important;
            padding: 0.75rem 1.5rem !important;
            border-radius: 12px;
            font-weight: 600;
        }

        .btn-logout:hover {
            background: #000 !important;
            transform: translateY(-2px);
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 140px 2rem 2rem;
        }

        .welcome-section {
            text-align: center;
            margin-bottom: 4rem;
        }

        .welcome-section h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #1a1a1a;
        }

        .welcome-section h1 span {
            color: #000;
        }

        .welcome-section p {
            font-size: 1.25rem;
            color: #666;
            font-weight: 400;
        }

        .loading {
            text-align: center;
            padding: 4rem;
            color: #666;
        }

        .loading i {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .stat-card {
            background: #fff;
            border: 1px solid #e5e5e5;
            padding: 2.5rem 2rem;
            border-radius: 16px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
        }

        .stat-card:hover {
            border-color: #d0d0d0;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            transform: translateY(-4px);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            color: #1a1a1a;
            opacity: 0.8;
        }

        .stat-number {
            font-size: 2.75rem;
            font-weight: 700;
            color: #000;
            margin-bottom: 0.5rem;
            font-feature-settings: 'tnum' 1;
        }

        .stat-label {
            font-size: 1rem;
            color: #666;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .dashboard-card {
            background: #fff;
            border: 1px solid #e5e5e5;
            padding: 3rem 2.5rem;
            border-radius: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .dashboard-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: #1a1a1a;
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .dashboard-card:hover::before {
            transform: scaleX(1);
        }

        .dashboard-card:hover {
            border-color: #d0d0d0;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
            transform: translateY(-8px);
        }

        .dashboard-card i {
            font-size: 3rem;
            margin-bottom: 1.75rem;
            color: #1a1a1a;
            opacity: 0.85;
        }

        .dashboard-card h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #1a1a1a;
        }

        .dashboard-card p {
            color: #666;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .card-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #1a1a1a;
            color: #fff;
            padding: 1rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border: 1px solid #1a1a1a;
        }

        .card-btn:hover {
            background: #fff;
            color: #1a1a1a;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        .recent-activity {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #f0f0f0;
        }

        .activity-header h3 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a1a1a;
        }

        .activity-header a {
            color: #1a1a1a;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .activity-header a:hover {
            color: #666;
        }

        .activity-item {
            display: flex;
            align-items: flex-start;
            padding: 1.75rem 0;
            border-bottom: 1px solid #f5f5f5;
            transition: all 0.2s ease;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-item:hover {
            background: #f8f8f8;
            padding-left: 1rem;
            border-radius: 8px;
        }

        .activity-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1.5rem;
            background: #1a1a1a;
            color: #fff;
            font-size: 1.1rem;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .activity-content h4 {
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 0.25rem;
            font-size: 1rem;
        }

        .activity-content p {
            color: #666;
            font-size: 0.9rem;
        }

        .no-data {
            text-align: center;
            padding: 3rem;
            color: #999;
        }

        .no-data i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .nav-menu {
                gap: 1rem;
            }

            .nav-container {
                padding: 0 1.5rem;
                flex-wrap: wrap;
            }

            .welcome-section h1 {
                font-size: 2.25rem;
            }

            .dashboard-container {
                padding: 120px 1rem 2rem;
            }

            .stats-grid,
            .dashboard-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .recent-activity {
                padding: 2rem;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in-up {
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
        }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="nav-logo" id="navLogo">
                <i class="fas fa-utensils"></i>
                <span id="restaurantName">Loading...</span>
            </div>
            <ul class="nav-menu" id="navMenu">
                <!-- Navigation will be populated dynamically -->
            </ul>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- Loading state -->
        <div id="loadingState" class="loading fade-in-up">
            <i class="fas fa-spinner"></i>
            <p>Loading your dashboard...</p>
        </div>

        <!-- Main content (hidden initially) -->
        <div id="mainContent" style="display: none;">
            <div class="welcome-section">
                <h1>Welcome back, <span id="userName">User</span>!</h1>
                <p id="welcomeMessage">Here's what's happening with your account</p>
            </div>

            <div class="stats-grid" id="statsGrid">
                <!-- Stats will be populated by JavaScript from database -->
            </div>

            <div class="dashboard-grid" id="dashboardGrid">
                <!-- Quick action cards will be populated from config/database -->
            </div>

            <div class="recent-activity fade-in-up" id="recentActivity">
                <div class="activity-header">
                    <h3 id="activityTitle">Recent Activity</h3>
                    <a href="orders.html" id="viewAllLink">View All →</a>
                </div>
                <div id="activityList">
                    <!-- Activities will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // ✅ NO HARDCODED VALUES - All data from database/localStorage
        let currentUserId = null;
        let restaurantConfig = null;
        let userData = null;

        // Initialize dashboard
        async function initDashboard() {
            try {
                // Get current user from localStorage (set during login)
                const storedUser = JSON.parse(localStorage.getItem('userData') || '{}');
                currentUserId = storedUser.id;
                
                if (!currentUserId) {
                    throw new Error('No user session found. Please login again.');
                }

                // Hide loading, show main content
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';

                // Fetch ALL data in parallel
                const [user, stats, activities, config] = await Promise.all([
                    fetchUserData(currentUserId),
                    fetchUserStats(currentUserId),
                    fetchRecentActivity(currentUserId),
                    fetchRestaurantConfig()
                ]);

                // Store globally
                userData = user;
                restaurantConfig = config;

                // Update UI with real data
                updateWelcomeSection();
                displayStats(stats);
                displayDashboardCards(config.quick_actions || []);
                displayRecentActivity(activities);
                setupNavigation(config.navigation || []);
                
                // Initialize animations
                staggerAnimations();
                animateCounters();
                
            } catch (error) {
                console.error('Error loading dashboard:', error);
                showError(`Failed to load dashboard: ${error.message}`);
            }
        }

        // 🚀 Fetch user data from database
        async function fetchUserData(userId) {
            const response = await fetch(`/api/user/${userId}`);
            if (!response.ok) throw new Error('Failed to fetch user data');
            return await response.json();
        }

        // 🚀 Fetch user statistics from database
        async function fetchUserStats(userId) {
            const response = await fetch(`/api/user/${userId}/stats`);
            if (!response.ok) throw new Error('Failed to fetch stats');
            return await response.json();
        }

        // 🚀 Fetch recent activity from database
        async function fetchRecentActivity(userId) {
            const response = await fetch(`/api/user/${userId}/activity`);
            if (!response.ok) throw new Error('Failed to fetch activity');
            return await response.json();
        }

        // 🚀 Fetch restaurant configuration (add this endpoint to server.js)
        async function fetchRestaurantConfig() {
            const response = await fetch('/api/config/restaurant');
            if (!response.ok) {
                // Fallback to default config if endpoint doesn't exist
                return {
                    name: 'Hulyanas Hill',
                    navigation: [
                        { title: 'Dashboard', icon: 'fas fa-home', href: 'dashboard.html' },
                        { title: 'Menu', icon: 'fas fa-utensils', href: 'menu.html' },
                        { title: 'Cart', icon: 'fas fa-shopping-cart', href: 'cart.html' },
                        { title: 'Orders', icon: 'fas fa-list', href: 'orders.html' },
                        { title: 'Profile', icon: 'fas fa-user', href: 'profile.html' }
                    ],
                    quick_actions: [
                        { icon: 'fas fa-utensils', title: 'Browse Menu', description: 'Discover our delicious menu items', href: 'menu.html' },
                        { icon: 'fas fa-shopping-cart', title: 'My Cart', description: 'Review items in your shopping cart', href: 'cart.html' },
                        { icon: 'fas fa-list', title: 'My Orders', description: 'Track your recent orders', href: 'orders.html' },
                        { icon: 'fas fa-user-edit', title: 'Profile', description: 'Manage your account information', href: 'profile.html' }
                    ]
                };
            }
            return await response.json();
        }

        // Update welcome section with real user data
        function updateWelcomeSection() {
            document.getElementById('userName').textContent = userData.full_name || `${userData.first_name} ${userData.last_name}`;
            document.getElementById('restaurantName').textContent = restaurantConfig.name || 'Restaurant';
            document.getElementById('welcomeMessage').textContent = 
                userData.total_orders > 0 
                    ? `You have ${userData.total_orders} ${userData.total_orders === 1 ? 'order' : 'orders'} with us`
                    : "Here's what's happening with your account";
            document.getElementById('activityTitle').textContent = restaurantConfig.activity_title || 'Recent Activity';
            document.getElementById('viewAllLink').textContent = `${restaurantConfig.view_all_text || 'View All'} →`;
        }

        // Display stats cards (REAL database values)
        function displayStats(stats) {
            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="stat-card fade-in-up">
                    <div class="stat-icon"><i class="fas fa-shopping-cart"></i></div>
                    <div class="stat-number" data-target="${stats.totalOrders}">0</div>
                    <div class="stat-label">Total Orders</div>
                </div>
                <div class="stat-card fade-in-up">
                    <div class="stat-icon"><i class="fas fa-dollar-sign"></i></div>
                    <div class="stat-number" data-target="${stats.totalSpent}">0.00</div>
                    <div class="stat-label">Total Spent</div>
                </div>
                <div class="stat-card fade-in-up">
                    <div class="stat-icon"><i class="fas fa-star"></i></div>
                    <div class="stat-number" data-target="${stats.avgRating}">0</div>
                    <div class="stat-label">Avg Rating</div>
                </div>
                <div class="stat-card fade-in-up">
                    <div class="stat-icon"><i class="fas fa-clock"></i></div>
                    <div class="stat-number" data-target="${stats.activeOrders}">0</div>
                    <div class="stat-label">Active Orders</div>
                </div>
            `;
        }

        // Display dynamic dashboard cards from config
        function displayDashboardCards(actions) {
            const dashboardGrid = document.getElementById('dashboardGrid');
            dashboardGrid.innerHTML = actions.map(action => `
                <div class="dashboard-card fade-in-up">
                    <i class="${action.icon}"></i>
                    <h3>${action.title}</h3>
                    <p>${action.description}</p>
                    <a href="${action.href}" class="card-btn">
                        ${action.button_text || 'Go to'} <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            `).join('');
        }

        // Setup dynamic navigation from config
        function setupNavigation(navItems) {
            const navMenu = document.getElementById('navMenu');
            const logoutItem = `
                <li>
                    <a href="/index.html" id="logoutBtn" class="btn-logout">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </li>
            `;
            
            navMenu.innerHTML = navItems.map(item => `
                <li><a href="${item.href}">
                    <i class="${item.icon}"></i> ${item.title}
                </a></li>
            `).join('') + logoutItem;
        }

        // Display recent activity (REAL database data)
        function displayRecentActivity(activities) {
            const activityList = document.getElementById('activityList');
            
            if (!activities || activities.length === 0) {
                activityList.innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-inbox"></i>
                        <h4>No recent activity</h4>
                        <p>Your activity will appear here once you start ordering</p>
                    </div>
                `;
                return;
            }

            activityList.innerHTML = activities.map(activity => `
                <div class="activity-item">
                    <div class="activity-icon">
                        ${getActivityIcon(activity.type, activity.action)}
                    </div>
                    <div class="activity-content">
                        <h4>${activity.display_action || activity.action}</h4>
                        <p>${formatActivityDetails(activity)} - ${formatDate(activity.created_at)}</p>
                    </div>
                </div>
            `).join('');
        }

        // Dynamic activity icons
        function getActivityIcon(type, action) {
            const icons = {
                'order': {
                    'delivered': 'fas fa-check-circle',
                    'New order placed': 'fas fa-shopping-cart',
                    'pending': 'fas fa-clock',
                    'preparing': 'fas fa-fire',
                    'out_for_delivery': 'fas fa-truck',
                    default: 'fas fa-list'
                },
                'user': 'fas fa-user',
                'system': 'fas fa-info-circle',
                default: 'fas fa-bell'
            };

            if (type === 'order' && icons[type][action]) {
                return icons[type][action];
            }
            return icons[type] || icons.default;
        }

        // Format activity details from database
        function formatActivityDetails(activity) {
            if (activity.details) {
                try {
                    const details = typeof activity.details === 'string' ? JSON.parse(activity.details) : activity.details;
                    if (details.order_number) return `Order #${details.order_number}`;
                    if (details.item_name) return `Item: ${details.item_name}`;
                } catch (e) {
                    console.warn('Could not parse activity details');
                }
            }
            return 'Activity details unavailable';
        }

        // Format date from database timestamp
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            
            if (diffHours < 1) return 'Just now';
            if (diffHours < 24) return `${diffHours}h ago`;
            return date.toLocaleDateString('en-US', { 
                month: 'short', 
                day: 'numeric',
                hour: 'numeric'
            });
        }

        // Animate stats counters from real database values
        function animateCounters() {
            const counters = document.querySelectorAll('.stat-number');
            counters.forEach(counter => {
                const target = parseFloat(counter.getAttribute('data-target')) || 0;
                const isCurrency = counter.getAttribute('data-target').includes('.');
                
                const updateCounter = () => {
                    let current = 0;
                    const increment = target / 100;
                    const timer = setInterval(() => {
                        current += increment;
                        if (isCurrency) {
                            counter.textContent = `$${Math.min(current, target).toFixed(2)}`;
                        } else {
                            counter.textContent = Math.floor(Math.min(current, target));
                        }
                        if (current >= target) {
                            clearInterval(timer);
                            if (isCurrency) {
                                counter.textContent = `$${target.toFixed(2)}`;
                            } else {
                                counter.textContent = Math.floor(target);
                            }
                        }
                    }, 25);
                };

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            updateCounter();
                            observer.unobserve(entry.target);
                        }
                    });
                });
                observer.observe(counter);
            });
        }

        // Stagger animations
        function staggerAnimations() {
            const elements = document.querySelectorAll('.fade-in-up');
            elements.forEach((el, index) => {
                el.style.animationDelay = `${index * 0.1}s`;
            });
        }

        // Show error message
        function showError(message) {
            const loadingState = document.getElementById('loadingState');
            loadingState.innerHTML = `
                <i class="fas fa-exclamation-triangle" style="color: #ff6b6b; font-size: 3rem; margin-bottom: 1rem;"></i>
                <h3 style="color: #ff6b6b; margin-bottom: 1rem;">Loading Failed</h3>
                <p>${message}</p>
                <div style="margin-top: 2rem;">
                    <button onclick="location.reload()" style="background: #1a1a1a; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; margin-right: 1rem;">Retry</button>
                    <a href="/index.html" style="background: #666; color: white; text-decoration: none; padding: 0.75rem 1.5rem; border-radius: 8px;">Go to Login</a>
                </div>
            `;
        }

        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.style.background = 'rgba(255, 255, 255, 1)';
                navbar.style.boxShadow = '0 2px 20px rgba(0, 0, 0, 0.08)';
            } else {
                navbar.style.background = 'rgba(255, 255, 255, 0.98)';
                navbar.style.boxShadow = 'none';
            }
        });

        // Logout functionality
        document.addEventListener('click', (e) => {
            if (e.target.id === 'logoutBtn' || e.target.closest('#logoutBtn')) {
                e.preventDefault();
                if (confirm('Are you sure you want to logout?')) {
                    localStorage.clear();
                    window.location.href = '/index.html';
                }
            }
        });

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(initDashboard, 800); // Realistic loading time
        });

        // Auto-refresh stats every 30 seconds
        setInterval(async () => {
            if (currentUserId && document.getElementById('statsGrid')) {
                try {
                    const stats = await fetchUserStats(currentUserId);
                    // Update only numbers without re-animating
                    document.querySelector('[data-stat="totalOrders"]').setAttribute('data-target', stats.totalOrders);
                    document.querySelector('[data-stat="totalSpent"]').setAttribute('data-target', stats.totalSpent);
                    document.querySelector('[data-stat="activeOrders"]').setAttribute('data-target', stats.activeOrders);
                } catch (e) {
                    console.warn('Auto-refresh failed:', e);
                }
            }
        }, 30000);
    </script>
</body>
</html>
