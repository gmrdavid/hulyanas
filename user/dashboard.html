<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Hulyanas Hill</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Keep all your existing styles exactly the same -->
    <style>
        /* YOUR EXISTING STYLES REMAIN UNCHANGED - PERFECT DESIGN */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            min-height: 100vh;
            line-height: 1.6;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid #e5e5e5;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 1rem 0;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a1a;
            gap: 0.75rem;
        }

        .nav-logo i {
            color: #000;
            font-size: 1.8rem;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        .nav-menu a {
            text-decoration: none;
            color: #4a4a4a;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .nav-menu a:hover {
            background: #f0f0f0;
            color: #1a1a1a;
            transform: translateY(-1px);
        }

        .btn-logout {
            background: #1a1a1a !important;
            color: #fff !important;
            padding: 0.75rem 1.5rem !important;
            border-radius: 12px;
            font-weight: 600;
        }

        .btn-logout:hover {
            background: #000 !important;
            transform: translateY(-2px);
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 140px 2rem 2rem;
        }

        .welcome-section {
            text-align: center;
            margin-bottom: 4rem;
        }

        .welcome-section h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #1a1a1a;
        }

        .welcome-section h1 span {
            color: #000;
        }

        .welcome-section p {
            font-size: 1.25rem;
            color: #666;
            font-weight: 400;
        }

        .loading {
            text-align: center;
            padding: 4rem;
            color: #666;
        }

        .loading i {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .stat-card {
            background: #fff;
            border: 1px solid #e5e5e5;
            padding: 2.5rem 2rem;
            border-radius: 16px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
        }

        .stat-card:hover {
            border-color: #d0d0d0;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            transform: translateY(-4px);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            color: #1a1a1a;
            opacity: 0.8;
        }

        .stat-number {
            font-size: 2.75rem;
            font-weight: 700;
            color: #000;
            margin-bottom: 0.5rem;
            font-feature-settings: 'tnum' 1;
        }

        .stat-label {
            font-size: 1rem;
            color: #666;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .dashboard-card {
            background: #fff;
            border: 1px solid #e5e5e5;
            padding: 3rem 2.5rem;
            border-radius: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .dashboard-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: #1a1a1a;
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .dashboard-card:hover::before {
            transform: scaleX(1);
        }

        .dashboard-card:hover {
            border-color: #d0d0d0;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
            transform: translateY(-8px);
        }

        .dashboard-card i {
            font-size: 3rem;
            margin-bottom: 1.75rem;
            color: #1a1a1a;
            opacity: 0.85;
        }

        .dashboard-card h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #1a1a1a;
        }

        .dashboard-card p {
            color: #666;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .card-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #1a1a1a;
            color: #fff;
            padding: 1rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border: 1px solid #1a1a1a;
        }

        .card-btn:hover {
            background: #fff;
            color: #1a1a1a;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        .recent-activity {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #f0f0f0;
        }

        .activity-header h3 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a1a1a;
        }

        .activity-header a {
            color: #1a1a1a;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .activity-header a:hover {
            color: #666;
        }

        .activity-item {
            display: flex;
            align-items: flex-start;
            padding: 1.75rem 0;
            border-bottom: 1px solid #f5f5f5;
            transition: all 0.2s ease;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-item:hover {
            background: #f8f8f8;
            padding-left: 1rem;
            border-radius: 8px;
        }

        .activity-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1.5rem;
            background: #1a1a1a;
            color: #fff;
            font-size: 1.1rem;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .activity-content h4 {
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 0.25rem;
            font-size: 1rem;
        }

        .activity-content p {
            color: #666;
            font-size: 0.9rem;
        }

        .no-data {
            text-align: center;
            padding: 3rem;
            color: #999;
        }

        .no-data i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #fcc;
        }

        @media (max-width: 768px) {
            .nav-menu {
                gap: 1rem;
            }

            .nav-container {
                padding: 0 1.5rem;
                flex-wrap: wrap;
            }

            .welcome-section h1 {
                font-size: 2.25rem;
            }

            .dashboard-container {
                padding: 120px 1rem 2rem;
            }

            .stats-grid,
            .dashboard-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .recent-activity {
                padding: 2rem;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in-up {
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo" id="navLogo">
                <i class="fas fa-spinner fa-spin"></i>
                <span>Loading...</span>
            </div>
            <ul class="nav-menu" id="navMenu">
                <!-- Navigation populated dynamically -->
            </ul>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- Loading state -->
        <div id="loadingState" class="loading fade-in-up">
            <i class="fas fa-spinner"></i>
            <p>Initializing your dashboard...</p>
        </div>

        <!-- Error state -->
        <div id="errorState" class="error-message fade-in-up" style="display: none;">
            <i class="fas fa-exclamation-triangle" style="font-size: 3rem; margin-bottom: 1rem; display: block;"></i>
            <h3>Dashboard Error</h3>
            <p id="errorMessage"></p>
            <button onclick="location.reload()" class="card-btn" style="margin-top: 1rem;">
                <i class="fas fa-redo"></i> Retry Loading
            </button>
        </div>

        <!-- Main content (hidden initially) -->
        <div id="mainContent" style="display: none;">
            <div class="welcome-section">
                <h1>Welcome back, <span id="userName">User</span>!</h1>
                <p id="welcomeSubtitle">Loading your personalized dashboard...</p>
            </div>

            <div class="stats-grid" id="statsGrid">
                <!-- Stats cards populated from database -->
            </div>

            <div class="dashboard-grid" id="dashboardGrid">
                <!-- Quick action cards -->
            </div>

            <div class="recent-activity fade-in-up" id="recentActivity">
                <div class="activity-header">
                    <h3>Recent Activity</h3>
                    <a href="orders.html">View All →</a>
                </div>
                <div id="activityList">
                    <!-- Activities populated from database -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global app state
        let currentUser = null;
        let token = null;

        // Initialize dashboard with proper authentication
        async function initDashboard() {
            try {
                showLoading();
                
                // Check authentication and get user data
                const authData = await checkAuthAndLoadUser();
                if (!authData) {
                    redirectToLogin();
                    return;
                }

                // Check role and redirect if admin
                if (authData.role === 'admin') {
                    window.location.href = '/admin/dashboard.html';
                    return;
                }

                // Load all dashboard data in parallel
                const [userData, statsData, activities] = await Promise.all([
                    fetchUserData(authData.id),
                    fetchUserStats(authData.id),
                    fetchRecentActivity(authData.id)
                ]);

                // Update global state
                currentUser = userData;
                token = authData.token;

                // Render dashboard
                hideLoading();
                renderDashboard(userData, statsData, activities);
                
            } catch (error) {
                console.error('Dashboard init error:', error);
                showError(`Failed to load dashboard: ${error.message}`);
            }
        }

        // Check authentication and load user session
        async function checkAuthAndLoadUser() {
            try {
                // Try to get token from localStorage
                const storedToken = localStorage.getItem('token');
                const storedUserId = localStorage.getItem('userId');
                
                if (!storedToken || !storedUserId) {
                    throw new Error('No authentication found');
                }

                // Verify token with backend
                const response = await fetch('/api/profile', {
                    headers: {
                        'Authorization': `Bearer ${storedToken}`
                    }
                });

                if (!response.ok) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('userId');
                    throw new Error('Invalid session');
                }

                const userData = await response.json();
                return {
                    id: userData.id,
                    role: userData.role || 'customer',
                    token: storedToken
                };
            } catch (error) {
                console.error('Auth check failed:', error);
                return null;
            }
        }

        // Fetch authenticated user data
        async function fetchUserData(userId) {
            const response = await fetch(`/api/user/${userId}`);
            if (!response.ok) throw new Error('Failed to fetch user data');
            return await response.json();
        }

        // Fetch user statistics from database
        async function fetchUserStats(userId) {
            const response = await fetch(`/api/user/${userId}/stats`);
            if (!response.ok) throw new Error('Failed to fetch stats');
            return await response.json();
        }

        // Fetch recent activity from database
        async function fetchRecentActivity(userId) {
            const response = await fetch(`/api/user/${userId}/activity`);
            if (!response.ok) return [];
            return await response.json();
        }

        // Render complete dashboard
        function renderDashboard(userData, statsData, activities) {
            populateNavigation();
            populateWelcome(userData);
            renderStats(statsData);
            renderQuickActions();
            renderActivities(activities);
            initAnimations();
        }

        // Populate navigation (hardcoded links but dynamic logo)
        function populateNavigation() {
            const navLogo = document.getElementById('navLogo');
            const navMenu = document.getElementById('navMenu');

            navLogo.innerHTML = `
                <i class="fas fa-utensils"></i>
                <span>Hulyanas Hill</span>
            `;

            navMenu.innerHTML = `
                <li><a href="dashboard.html" style="background: #f0f0f0; color: #1a1a1a;">
                    <i class="fas fa-home"></i> Dashboard
                </a></li>
                <li><a href="../menu.html">
                    <i class="fas fa-utensils"></i> Menu
                </a></li>
                <li><a href="cart.html">
                    <i class="fas fa-shopping-cart"></i> Cart
                </a></li>
                <li><a href="orders.html">
                    <i class="fas fa-list"></i> Orders
                </a></li>
                <li><a href="profile.html">
                    <i class="fas fa-user"></i> Profile
                </a></li>
                <li><a href="/index.html" id="logoutBtn" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a></li>
            `;
        }

        // Populate welcome section with real user data
        function populateWelcome(userData) {
            document.getElementById('userName').textContent = userData.full_name || userData.first_name;
            document.getElementById('welcomeSubtitle').textContent = 
                `Your personalized dashboard with ${userData.total_orders || 0}+ orders`;
        }

        // Render stats cards with real database data
        function renderStats(stats) {
            const statsGrid = document.getElementById('statsGrid');
            const statCards = [
                {
                    icon: 'fas fa-shopping-cart',
                    number: stats.totalOrders || 0,
                    label: 'Total Orders',
                    key: 'totalOrders'
                },
                {
                    icon: 'fas fa-dollar-sign',
                    number: parseFloat(stats.totalSpent || 0),
                    label: 'Total Spent',
                    isCurrency: true,
                    key: 'totalSpent'
                },
                {
                    icon: 'fas fa-star',
                    number: parseFloat(stats.avgRating || 4.5).toFixed(1),
                    label: 'Avg Rating',
                    key: 'avgRating'
                },
                {
                    icon: 'fas fa-clock',
                    number: stats.activeOrders || 0,
                    label: 'Active Orders',
                    key: 'activeOrders'
                }
            ];

            statsGrid.innerHTML = statCards.map(stat => `
                <div class="stat-card fade-in-up">
                    <div class="stat-icon">
                        <i class="${stat.icon}"></i>
                    </div>
                    <div class="stat-number" data-target="${stat.number}" data-is-currency="${stat.isCurrency || false}">
                        ${stat.isCurrency ? '$0.00' : '0'}
                    </div>
                    <div class="stat-label">${stat.label}</div>
                </div>
            `).join('');

            // Animate counters after render
            setTimeout(animateCounters, 500);
        }

        // Quick action cards (functional links)
        function renderQuickActions() {
            const dashboardGrid = document.getElementById('dashboardGrid');
            dashboardGrid.innerHTML = `
                <div class="dashboard-card fade-in-up">
                    <i class="fas fa-utensils"></i>
                    <h3>Browse Menu</h3>
                    <p>Discover our delicious menu items</p>
                    <a href="../menu.html" class="card-btn">View Menu <i class="fas fa-arrow-right"></i></a>
                </div>
                <div class="dashboard-card fade-in-up">
                    <i class="fas fa-shopping-cart"></i>
                    <h3>My Cart</h3>
                    <p>Review items in your shopping cart</p>
                    <a href="cart.html" class="card-btn">Go to Cart <i class="fas fa-arrow-right"></i></a>
                </div>
                <div class="dashboard-card fade-in-up">
                    <i class="fas fa-list"></i>
                    <h3>My Orders</h3>
                    <p>Track your recent orders</p>
                    <a href="orders.html" class="card-btn">View Orders <i class="fas fa-arrow-right"></i></a>
                </div>
                <div class="dashboard-card fade-in-up">
                    <i class="fas fa-user-edit"></i>
                    <h3>Profile</h3>
                    <p>Manage your account information</p>
                    <a href="profile.html" class="card-btn">Edit Profile <i class="fas fa-arrow-right"></i></a>
                </div>
            `;
        }

        // Render recent activities from database
        function renderActivities(activities) {
            const activityList = document.getElementById('activityList');
            
            if (!activities || activities.length === 0) {
                activityList.innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-inbox"></i>
                        <h4>No recent activity</h4>
                        <p>Your activity will appear here once you start ordering</p>
                    </div>
                `;
                return;
            }

            activityList.innerHTML = activities.map(activity => `
                <div class="activity-item">
                    <div class="activity-icon">
                        <i class="${getActivityIcon(activity.type, activity.action)}"></i>
                    </div>
                    <div class="activity-content">
                        <h4>${activity.display_action || activity.action}</h4>
                        <p>${formatActivityDetails(activity)} • ${formatDate(activity.created_at)}</p>
                    </div>
                </div>
            `).join('');
        }

        // Get activity icon based on type
        function getActivityIcon(type, action) {
            const icons = {
                'order': {
                    'New order placed': 'fas fa-shopping-cart',
                    'Order delivered': 'fas fa-check-circle',
                    'Order cancelled': 'fas fa-times-circle',
                    default: 'fas fa-list'
                },
                'user': 'fas fa-user',
                'menu': 'fas fa-utensils',
                'system': 'fas fa-cog'
            };
            return icons[type]?.[action] || icons[type] || 'fas fa-info-circle';
        }

        // Format activity details
        function formatActivityDetails(activity) {
            if (activity.details && typeof activity.details === 'object') {
                if (activity.details.order_number) {
                    return `Order ${activity.details.order_number}`;
                }
                if (activity.details.email) {
                    return `Email: ${activity.details.email}`;
                }
            }
            return 'Recent activity';
        }

        // Format database timestamp
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            
            if (diffHours < 1) return 'Just now';
            if (diffHours < 24) return `${diffHours}h ago`;
            if (diffHours < 168) return `${Math.floor(diffHours / 24)}d ago`;
            return date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });
        }

        // Animate counters from 0 to real database values
        function animateCounters() {
            const counters = document.querySelectorAll('.stat-number');
            counters.forEach(counter => {
                const target = parseFloat(counter.getAttribute('data-target'));
                const isCurrency = counter.getAttribute('data-is-currency') === 'true';
                
                let current = 0;
                const increment = target / 100;
                const timer = setInterval(() => {
                    current += increment;
                    if (isCurrency) {
                        counter.textContent = `$${Math.min(current, target).toFixed(2)}`;
                    } else {
                        counter.textContent = Math.floor(Math.min(current, target));
                    }
                    if (current >= target) {
                        clearInterval(timer);
                        if (isCurrency) {
                            counter.textContent = `$${target.toFixed(2)}`;
                        } else {
                            counter.textContent = Math.floor(target);
                        }
                    }
                }, 25);
            });
        }

        // Initialize animations
        function initAnimations() {
            const elements = document.querySelectorAll('.fade-in-up');
            elements.forEach((el, index) => {
                el.style.animationDelay = `${index * 0.1}s`;
            });
        }

        // UI State Management
        function showLoading() {
            document.getElementById('loadingState').style.display = 'block';
            document.getElementById('errorState').style.display = 'none';
            document.getElementById('mainContent').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
        }

        function showError(message) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
            document.getElementById('errorMessage').textContent = message;
        }

        function redirectToLogin() {
            localStorage.removeItem('token');
            localStorage.removeItem('userId');
            window.location.href = '/index.html';
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            // Role-based redirect check
            const userRole = localStorage.getItem('userRole');
            if (userRole === 'admin') {
                window.location.href = '/admin/dashboard.html';
                return;
            }
            initDashboard();
        });

        // Global logout handler
        document.addEventListener('click', (e) => {
            if (e.target.id === 'logoutBtn' || e.target.closest('#logoutBtn')) {
                e.preventDefault();
                if (confirm('Are you sure you want to logout?')) {
                    localStorage.clear();
                    window.location.href = '/index.html';
                }
            }
        });

        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            const navbar = document.querySelector('.navbar');
            if (window.scrollY > 50) {
                navbar.style.background = 'rgba(255, 255, 255, 1)';
                navbar.style.boxShadow = '0 2px 20px rgba(0, 0, 0, 0.08)';
            } else {
                navbar.style.background = 'rgba(255, 255, 255, 0.98)';
                navbar.style.boxShadow = 'none';
            }
        });
    </script>
</body>
</html>
