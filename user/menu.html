<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Hulyanas Hill</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            min-height: 100vh;
            line-height: 1.6;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid #e5e5e5;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 1rem 0;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a1a;
            gap: 0.75rem;
            text-decoration: none;
        }

        .nav-logo i {
            color: #000;
            font-size: 1.8rem;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        .nav-menu a {
            text-decoration: none;
            color: #4a4a4a;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .nav-menu a:hover {
            background: #f0f0f0;
            color: #1a1a1a;
            transform: translateY(-1px);
        }

        .nav-menu a.active {
            background: #1a1a1a;
            color: #fff;
        }

        .cart-badge {
            position: relative;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #000;
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 140px 2rem 2rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .page-header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #1a1a1a;
            position: relative;
        }

        .page-header h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: #1a1a1a;
            border-radius: 2px;
        }

        .cart-summary {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: #fff;
            border: 2px solid #e5e5e5;
            color: #1a1a1a;
            padding: 1rem 1.75rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-top: 1rem;
        }

        .cart-summary:hover {
            border-color: #1a1a1a;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            transform: translateY(-2px);
        }

        .categories-container {
            margin-bottom: 4rem;
            overflow: hidden;
        }

        .categories-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .categories-header h3 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a1a1a;
        }

        .categories-list {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding-bottom: 1rem;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-behavior: smooth;
        }

        .categories-list::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            background: #f8f8f8;
            border: 2px solid #e5e5e5;
            color: #666;
            padding: 0.875rem 1.75rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .category-btn:hover,
        .category-btn.active {
            background: #1a1a1a;
            color: #fff;
            border-color: #1a1a1a;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2rem;
        }

        .menu-card {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s ease;
            position: relative;
            cursor: pointer;
        }

        .menu-card:hover {
            border-color: #d0d0d0;
            box-shadow: 0 25px 50px rgba(0,0,0,0.12);
            transform: translateY(-8px);
        }

        .menu-image {
            height: 220px;
            background: linear-gradient(135deg, #f8f8f8 0%, #f0f0f0 100%);
            position: relative;
            overflow: hidden;
        }

        .menu-image::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, 
                rgba(26,26,26,0.05) 0%, 
                rgba(26,26,26,0.1) 50%, 
                rgba(26,26,26,0.05) 100%);
        }

        .menu-image i {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            color: #ccc;
            z-index: 1;
        }

        .menu-content {
            padding: 2rem;
        }

        .menu-name {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #1a1a1a;
            line-height: 1.3;
        }

        .menu-description {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .menu-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1.25rem;
            border-top: 1px solid #f0f0f0;
        }

        .menu-price {
            font-size: 1.6rem;
            font-weight: 800;
            color: #000;
            font-feature-settings: 'tnum' 1;
        }

        .add-to-cart-container {
            position: relative;
        }

        .add-to-cart {
            background: #1a1a1a;
            color: #fff;
            border: none;
            padding: 0.875rem 1.75rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 140px;
        }

        .add-to-cart:hover:not(.loading) {
            background: #000;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .add-to-cart.loading {
            pointer-events: none;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f8f8f8;
            padding: 0.625rem 1rem;
            border-radius: 12px;
            border: 1px solid #e5e5e5;
            min-width: 140px;
        }

        .qty-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: #fff;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover {
            background: #1a1a1a;
            color: #fff;
            transform: scale(1.05);
        }

        .quantity {
            font-weight: 700;
            min-width: 24px;
            text-align: center;
            font-size: 1.1rem;
        }

        .empty-state {
            text-align: center;
            grid-column: 1 / -1;
            padding: 6rem 2rem;
        }

        .empty-state i {
            font-size: 5rem;
            color: #e5e5e5;
            margin-bottom: 2rem;
        }

        .empty-state h3 {
            font-size: 1.75rem;
            font-weight: 600;
            color: #666;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .nav-menu {
                gap: 1rem;
            }

            .nav-container {
                padding: 0 1.5rem;
            }

            .menu-container {
                padding: 120px 1rem 2rem;
            }

            .page-header h1 {
                font-size: 2.75rem;
            }

            .menu-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .categories-list {
                gap: 0.75rem;
            }

            .category-btn {
                padding: 0.75rem 1.25rem;
                font-size: 0.85rem;
            }

            .menu-footer {
                flex-direction: column;
                gap: 1rem;
            }

            .add-to-cart {
                width: 100%;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in-up {
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1a1a1a;
            color: #fff;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            transform: translateX(400px);
            transition: all 0.3s ease;
            z-index: 3000;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            background: #16a34a;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="nav-logo">
                <i class="fas fa-utensils"></i>
                <span>Hulyanas Hill</span>
            </a>
            <ul class="nav-menu">
                <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="menu.html" class="active"><i class="fas fa-utensils"></i> Menu</a></li>
                <li><a href="cart.html" class="cart-badge">
                    <i class="fas fa-shopping-cart"></i> Cart
                    <span class="cart-count" id="cartCount">0</span>
                </a></li>
                <li><a href="orders.html"><i class="fas fa-list"></i> Orders</a></li>
                <li><a href="profile.html"><i class="fas fa-user"></i> Profile</a></li>
            </ul>
        </div>
    </nav>

    <div class="menu-container">
        <div class="page-header fade-in-up">
            <h1>Our Menu</h1>
            <div class="cart-summary" id="cartSummary">
                <i class="fas fa-shopping-cart"></i>
                <span id="cartTotal">0</span> items in cart • ₱<span id="cartSubtotal">0.00</span>
            </div>
        </div>

        <div class="categories-container fade-in-up">
            <div class="categories-header">
                <h3>Explore Menu</h3>
            </div>
            <div class="categories-list" id="menuCategories">
                <button class="category-btn active" data-category="all">All</button>
            </div>
        </div>

        <div class="menu-grid" id="menuItems">
            <!-- Menu items will be dynamically loaded -->
        </div>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

<script>
    const API_URL = 'https://hulyanas.onrender.com/api';

    let menuData = [];
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let currentCategory = 'all';

    // Initialize
    document.addEventListener('DOMContentLoaded', async function () {
        await loadMenuFromDatabase();
        updateCartDisplay();
        renderCategories();
        renderMenuItems(menuData);
        staggerAnimations();
        setupEventListeners();
    });

    // LOAD MENU FROM DATABASE
    async function loadMenuFromDatabase() {
        try {
            const response = await fetch(`${API_URL}/menu`);

            if (!response.ok) {
                throw new Error('Failed to fetch menu');
            }

            const apiResponse = await response.json();
            
            // ✅ Fix: Handle both flat array and {data: []} response
            const rawData = apiResponse.data || apiResponse;
            
            // ✅ Only available items
            menuData = Array.isArray(rawData) 
                ? rawData.filter(item => item.is_available == 1)
                : [];
                
            console.log('✅ Loaded menu items:', menuData.length);

        } catch (error) {
            console.error('🚨 Error loading menu:', error);
            document.getElementById('menuItems').innerHTML = `
                <div class="empty-state fade-in-up">
                    <i class="fas fa-exclamation-circle"></i>
                    <h3>Failed to load menu</h3>
                    <p>Please refresh the page</p>
                </div>
            `;
        }
    }

    function renderCategories() {
        const categories = [
            'all',
            ...Array.from(new Set(menuData.map(item => item.category)))
        ];

        const container = document.getElementById('menuCategories');

        container.innerHTML = '';

        categories.forEach((category, index) => {
            const btn = document.createElement('button');

            btn.className = `category-btn ${index === 0 ? 'active' : ''}`;
            btn.dataset.category = category;

            btn.textContent =
                category.charAt(0).toUpperCase() + category.slice(1);

            container.appendChild(btn);
        });
    }

    function renderMenuItems(items) {
        const container = document.getElementById('menuItems');
        container.innerHTML = '';

        if (items.length === 0) {
            container.innerHTML = `
                <div class="empty-state fade-in-up">
                    <i class="fas fa-utensils"></i>
                    <h3>No items available</h3>
                    <p>Check back soon for our delicious menu</p>
                </div>
            `;
            return;
        }

        items.forEach((item, index) => {
            const card = createMenuCard(item);

            card.style.animationDelay = `${index * 0.1}s`;
            card.classList.add('fade-in-up');

            container.appendChild(card);
        });
    }

    function createMenuCard(item) {
        const cartItem = cart.find(c => c.id === item.id);
        const quantity = cartItem ? cartItem.quantity : 0;

        const imageUrl = item.image_url
            ? `https://hulyanas.onrender.com${item.image_url}`
            : '';

        const card = document.createElement('div');
        card.className = 'menu-card';

        card.innerHTML = `
            <div class="menu-image">
                ${
                    imageUrl
                        ? `<img 
                                src="${imageUrl}" 
                                alt="${item.name}" 
                                style="
                                    width:100%;
                                    height:100%;
                                    object-fit:cover;
                                "
                           >`
                        : `<i class="fas fa-utensils"></i>`
                }
            </div>

            <div class="menu-content">
                <h3 class="menu-name">${item.name}</h3>

                <p class="menu-description">
                    ${item.description || 'No description available'}
                </p>

                <div class="menu-footer">
                    <div class="menu-price">
                        ₱${Number(item.price).toFixed(2)}
                    </div>

                    <div class="add-to-cart-container">
                        ${
                            quantity > 0
                                ? `
                                <div class="quantity-controls">
                                    <button 
                                        class="qty-btn" 
                                        data-action="decrease" 
                                        data-id="${item.id}"
                                    >-</button>

                                    <span class="quantity">${quantity}</span>

                                    <button 
                                        class="qty-btn" 
                                        data-action="increase" 
                                        data-id="${item.id}"
                                    >+</button>
                                </div>
                            `
                                : `
                                <button 
                                    class="add-to-cart" 
                                    data-id="${item.id}"
                                >
                                    <i class="fas fa-plus"></i> Add
                                </button>
                            `
                        }
                    </div>
                </div>
            </div>
        `;

        return card;
    }

    function setupEventListeners() {

        // CATEGORY FILTER
        document.getElementById('menuCategories')
            .addEventListener('click', (e) => {

                if (e.target.classList.contains('category-btn')) {

                    document.querySelectorAll('.category-btn')
                        .forEach(btn => btn.classList.remove('active'));

                    e.target.classList.add('active');

                    currentCategory = e.target.dataset.category;

                    const filteredItems =
                        currentCategory === 'all'
                            ? menuData
                            : menuData.filter(
                                item => item.category === currentCategory
                            );

                    renderMenuItems(filteredItems);
                }
            });

        // CART ACTIONS
        document.addEventListener('click', (e) => {

            const addBtn = e.target.closest('.add-to-cart');
            const qtyBtn = e.target.closest('.qty-btn');

            if (addBtn) {
                addToCart(parseInt(addBtn.dataset.id));
            }

            if (qtyBtn) {
                handleQuantityChange(
                    parseInt(qtyBtn.dataset.id),
                    qtyBtn.dataset.action
                );
            }
        });

        // CART SUMMARY CLICK
        document.getElementById('cartSummary')
            .addEventListener('click', () => {
                window.location.href = 'cart.html';
            });
    }

    function addToCart(itemId) {

        const item = menuData.find(i => i.id === itemId);

        if (!item) return;

        const existingItem = cart.find(c => c.id === itemId);

        if (existingItem) {
            existingItem.quantity += 1;
        } else {
            cart.push({
                id: item.id,
                name: item.name,
                price: item.price,
                image_url: item.image_url,
                quantity: 1
            });
        }

        localStorage.setItem('cart', JSON.stringify(cart));

        updateCartDisplay();

        showToast('Item added to cart!');

        rerenderCurrentCategory();
    }

    function handleQuantityChange(itemId, action) {

        const cartItem = cart.find(c => c.id === itemId);

        if (!cartItem) return;

        if (action === 'increase') {
            cartItem.quantity += 1;
        }

        if (action === 'decrease') {

            if (cartItem.quantity > 1) {
                cartItem.quantity -= 1;
            } else {
                cart = cart.filter(c => c.id !== itemId);
            }
        }

        localStorage.setItem('cart', JSON.stringify(cart));

        updateCartDisplay();

        rerenderCurrentCategory();
    }

    function rerenderCurrentCategory() {

        const filteredItems =
            currentCategory === 'all'
                ? menuData
                : menuData.filter(
                    item => item.category === currentCategory
                );

        renderMenuItems(filteredItems);
    }

    function updateCartDisplay() {

        const totalItems = cart.reduce(
            (sum, item) => sum + (item.quantity || 0),
            0
        );

        const subtotal = cart.reduce(
            (sum, item) =>
                sum + (Number(item.price) * (item.quantity || 0)),
            0
        );

        document.getElementById('cartCount').textContent = totalItems;
        document.getElementById('cartTotal').textContent = totalItems;

        document.getElementById('cartSubtotal').textContent =
            subtotal.toFixed(2);
    }

    function showToast(message) {

        const toast = document.getElementById('toast');

        toast.textContent = message;

        toast.classList.add('show', 'success');

        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    function staggerAnimations() {

        const elements = document.querySelectorAll('.fade-in-up');

        elements.forEach((el, index) => {
            el.style.animationDelay = `${index * 0.1}s`;
        });
    }

    // NAVBAR EFFECT
    window.addEventListener('scroll', () => {

        const navbar = document.querySelector('.navbar');

        if (window.scrollY > 50) {
            navbar.style.background = 'rgba(255, 255, 255, 1)';
            navbar.style.boxShadow =
                '0 2px 20px rgba(0, 0, 0, 0.08)';
        } else {
            navbar.style.background =
                'rgba(255, 255, 255, 0.98)';
            navbar.style.boxShadow =
                '0 1px 10px rgba(0, 0, 0, 0.05)';
        }
    });
</script>
</body>
</html>
