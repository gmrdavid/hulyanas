<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Hulyanas Hill</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* EXACT ADMIN PANEL THEME */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        /* BACKGROUND HERO IMAGE WITH OVERLAY */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(26, 26, 26, 0.85), rgba(26, 26, 26, 0.85)),
                url('images/main.png') center/cover;
            z-index: -1;
        }

        .auth-container {
            max-width: 450px;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        /* COMPACT ADMIN-STYLE AUTH CARD */
        .auth-card {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #1a1a1a, #333);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 1rem;
        }

        .auth-logo i {
            font-size: 1.5rem;
            color: #1a1a1a;
            background: #f0f0f0;
            padding: 0.5rem;
            border-radius: 10px;
        }

        .auth-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 0.25rem;
        }

        .auth-subtitle {
            color: #666;
            font-size: 0.9rem;
            font-weight: 400;
        }

        /* COMPACT FORM ROW */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 0;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 0.95rem;
            background: #fff;
            font-weight: 400;
            color: #1a1a1a;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input::placeholder {
            color: #999;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1a1a1a;
            box-shadow: 0 0 0 3px rgba(26,26,26,0.08);
            background: #fafafa;
        }

        /* COMPACT ADMIN BUTTON STYLE */
        .btn {
            width: 100%;
            padding: 0.875rem 1.5rem;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .btn:hover {
            background: #000;
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(26,26,26,0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* LOADING STATE */
        .btn.loading {
            pointer-events: none;
        }

        .btn.loading::after {
            content: '';
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* COMPACT MESSAGES */
        .message {
            padding: 0.875rem 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            font-weight: 500;
            font-size: 0.9rem;
            display: none;
            border-left: 3px solid;
        }

        .message.success {
            background: #f0fdf4;
            color: #166534;
            border-color: #22c55e;
        }

        .message.error {
            background: #fef2f2;
            color: #dc2626;
            border-color: #ef4444;
        }

        /* COMPACT AUTH LINKS */
        .auth-links {
            text-align: center;
            padding-top: 1.5rem;
            border-top: 1px solid #e5e5e5;
        }

        .auth-links p {
            margin-bottom: 1rem;
            color: #666;
            font-size: 0.9rem;
        }

        .auth-links a {
            color: #1a1a1a;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1.25rem;
            border-radius: 10px;
            transition: all 0.2s ease;
            background: #f0f0f0;
        }

        .auth-links a:hover {
            background: #1a1a1a;
            color: #fff;
            transform: translateY(-1px);
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0.875rem;
            }
            
            .auth-container {
                max-width: 400px;
                margin: 0 1rem;
            }

            .auth-card {
                padding: 2rem 1.5rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem;
            }

            .auth-card {
                padding: 1.75rem 1.25rem;
            }

            .auth-title {
                font-size: 1.5rem;
            }
            
            .auth-logo {
                font-size: 1.25rem;
            }
        }

        /* FLOATING LOGO */
        .floating-logo {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 1000;
            opacity: 0.9;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>
    <!-- Floating Logo -->
    <div class="floating-logo">
        <div style="display: flex; align-items: center; gap: 0.5rem; font-size: 1.25rem; font-weight: 700; color: #fff; background: rgba(255,255,255,0.1); padding: 0.75rem; border-radius: 12px; backdrop-filter: blur(10px);">
            <i class="fas fa-utensils" style="font-size: 1.5rem; color: #fff;"></i>
            <span>Hulyanas Hill</span>
        </div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-user-plus"></i>
                    <span>Create Account</span>
                </div>
                <h1 class="auth-title">Join Hulyanas Hill</h1>
                <p class="auth-subtitle">Create your account to start ordering</p>
            </div>
            
            <div id="message" class="message"></div>

            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="fullName" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" id="phone" placeholder="+63 955 123 4567">
                    </div>
                </div>
                
                <div class="form-group full">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="johndoe" required>
                </div>
                
                <div class="form-group full">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="john.doe@email.com" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="••••••••" minlength="6" required>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="••••••••" minlength="6" required>
                    </div>
                </div>
                
                <button type="submit" class="btn">
                    <i class="fas fa-user-plus"></i>
                    Create Account
                </button>
            </form>
            
            <div class="auth-links">
                <p>Already have an account? <a href="login.html"><i class="fas fa-sign-in-alt"></i> Sign In</a></p>
                <a href="../index.html"><i class="fas fa-home"></i> Back to Home</a>
            </div>
        </div>
    </div>

 <script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('registerForm');
    const btn = form.querySelector('.btn');
    const messageEl = document.getElementById('message');
    const API_BASE = 'http://localhost:3000/api'; // Change if deploying

    // Real-time validation
    const usernameInput = document.getElementById('username');
    const emailInput = document.getElementById('email');
    
    usernameInput.addEventListener('blur', debounce(checkUsername, 500));
    emailInput.addEventListener('blur', debounce(checkEmail, 500));

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const fullName = document.getElementById('fullName').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        // Client-side validation
        if (!fullName || !username || !email || !password) {
            showMessage('Please fill in all required fields', 'error');
            return;
        }

        if (password.length < 6) {
            showMessage('Password must be at least 6 characters', 'error');
            return;
        }

        if (password !== confirmPassword) {
            showMessage('Passwords do not match', 'error');
            return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            showMessage('Please enter a valid email address', 'error');
            return;
        }

        // Show loading
        const originalText = btn.innerHTML;
        btn.classList.add('loading');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

        try {
            const response = await fetch(`${API_BASE}/register`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    fullName,
                    phone: phone || null,
                    username,
                    email,
                    password
                })
            });

            const data = await response.json();

            btn.classList.remove('loading');
            btn.innerHTML = originalText;

            if (response.ok && data.success) {
                showMessage('Account created successfully! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } else {
                showMessage(data.error || 'Registration failed', 'error');
            }
        } catch (error) {
            btn.classList.remove('loading');
            btn.innerHTML = originalText;
            showMessage('Network error. Please check if server is running.', 'error');
            console.error('Registration error:', error);
        }
    });

    // Real-time password match check
    document.getElementById('confirmPassword').addEventListener('input', function() {
        const password = document.getElementById('password').value;
        const confirmPassword = this.value;
        
        if (confirmPassword && password !== confirmPassword) {
            this.style.borderColor = '#ef4444';
        } else {
            this.style.borderColor = '#e0e0e0';
        }
    });
});

async function checkUsername() {
    const username = document.getElementById('username').value.trim();
    if (username.length < 3) return;

    try {
        const response = await fetch('http://localhost:3000/api/check-username', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username })
        });
        const data = await response.json();
        
        const input = document.getElementById('username');
        if (data.exists) {
            input.style.borderColor = '#ef4444';
            showMessage('Username already exists', 'error');
        } else {
            input.style.borderColor = '#22c55e';
        }
    } catch (error) {
        console.error('Username check failed:', error);
    }
}

async function checkEmail() {
    const email = document.getElementById('email').value.trim();
    if (!email) return;

    try {
        const response = await fetch('http://localhost:3000/api/check-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const data = await response.json();
        
        const input = document.getElementById('email');
        if (data.exists) {
            input.style.borderColor = '#ef4444';
            showMessage('Email already registered', 'error');
        } else {
            input.style.borderColor = '#22c55e';
        }
    } catch (error) {
        console.error('Email check failed:', error);
    }
}

function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
        const later = () => {
            clearTimeout(timeout);
            func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
    };
}

function showMessage(text, type) {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.className = `message ${type}`;
    msg.style.display = 'block';
    
    setTimeout(() => {
        msg.style.display = 'none';
    }, 5000);
}

// Enter key support
document.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        document.getElementById('registerForm').dispatchEvent(new Event('submit'));
    }
});
</script>
</body>
</html>
