<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Hulyanas Hill</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
                *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background:#fafafa;
            color:#1a1a1a;
            line-height:1.6;
        }

        /* NAVBAR */

        .navbar{
            background:rgba(255,255,255,0.98);
            backdrop-filter:blur(20px);
            border-bottom:1px solid #e5e5e5;
            position:fixed;
            top:0;
            width:100%;
            z-index:1000;
            padding:.9rem 0;
        }

        .nav-container{
            max-width:1300px;
            margin:auto;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 1.5rem;
        }

        .nav-logo{
            display:flex;
            align-items:center;
            gap:.7rem;
            text-decoration:none;
            color:#1a1a1a;
            font-size:1.35rem;
            font-weight:700;
        }

        .nav-logo i{
            font-size:1.5rem;
        }

        .nav-menu{
            display:flex;
            align-items:center;
            gap:.8rem;
            list-style:none;
            flex-wrap:wrap;
        }

        .nav-menu a{
            text-decoration:none;
            color:#555;
            font-weight:500;
            padding:.7rem 1rem;
            border-radius:12px;
            transition:.25s ease;
            display:flex;
            align-items:center;
            gap:.5rem;
            font-size:.92rem;
        }

        .nav-menu a:hover{
            background:#f2f2f2;
            color:#000;
        }

        .btn-logout{
            background:#111 !important;
            color:#fff !important;
            padding:.75rem 1.3rem !important;
            border-radius:12px;
        }

        .btn-logout:hover{
            background:#000 !important;
        }

        /* PAGE */

        .orders-container{
            max-width:1300px;
            margin:auto;
            padding:120px 1.5rem 3rem;
        }

        .page-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:1rem;
            margin-bottom:2rem;
            flex-wrap:wrap;
        }

        .page-header h1{
            font-size:2.3rem;
            font-weight:700;
            letter-spacing:-1px;
        }

        /* STATS */

        .orders-stats{
            display:flex;
            gap:1rem;
            flex-wrap:wrap;
        }

        .stat-item{
            background:#fff;
            border:1px solid #e9e9e9;
            border-radius:18px;
            padding:1rem 1.4rem;
            min-width:120px;
            text-align:center;
            box-shadow:0 5px 18px rgba(0,0,0,0.03);
        }

        .stat-number{
            display:block;
            font-size:1.5rem;
            font-weight:700;
            color:#000;
        }

        .stat-label{
            font-size:.75rem;
            letter-spacing:1px;
            color:#777;
            text-transform:uppercase;
            margin-top:.15rem;
        }

        /* LIST */

        .orders-list{
            display:flex;
            flex-direction:column;
            gap:1.4rem;
        }

        /* CARD */

        .order-card{
            background:#fff;
            border:1px solid #ececec;
            border-radius:24px;
            overflow:hidden;
            transition:.3s ease;
            box-shadow:0 8px 25px rgba(0,0,0,0.04);
        }

        .order-card:hover{
            transform:translateY(-3px);
            box-shadow:0 16px 35px rgba(0,0,0,0.08);
        }

        /* HEADER */

        .order-header{
            padding:1.5rem 2rem;
            border-bottom:1px solid #f3f3f3;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:1rem;
            flex-wrap:wrap;
        }

        .order-number{
            font-size:1.15rem;
            font-weight:700;
        }

        .order-status{
            padding:.5rem 1.2rem;
            border-radius:50px;
            font-size:.75rem;
            font-weight:700;
            letter-spacing:.5px;
            text-transform:uppercase;
        }

        /* STATUS COLORS */

        .status-pending{
            background:#fff3cd;
            color:#856404;
            border:1px solid #ffe69c;
        }

        .status-preparing{
            background:#e8f4ff;
            color:#0c5460;
            border:1px solid #cce7ff;
        }

        .status-out-for-delivery{
            background:#eaf8ee;
            color:#155724;
            border:1px solid #cfead6;
        }

        .status-delivered{
            background:#f3f3f3;
            color:#111;
            border:1px solid #e0e0e0;
        }

        .status-cancelled{
            background:#fdecec;
            color:#721c24;
            border:1px solid #f5c6cb;
        }

        /* META */

        .order-meta{
            padding:1rem 2rem 0;
            display:flex;
            gap:1.5rem;
            flex-wrap:wrap;
            color:#666;
            font-size:.92rem;
        }

        .order-meta span{
            display:flex;
            align-items:center;
            gap:.45rem;
        }

        /* ITEMS */

        .order-items{
            padding:1rem 2rem;
        }

        .order-item{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:1rem;
            padding:1rem 0;
            border-bottom:1px solid #f5f5f5;
        }

        .order-item:last-child{
            border-bottom:none;
        }

        .item-info{
            display:flex;
            align-items:center;
            gap:1rem;
            min-width:0;
        }

        .item-icon{
            width:52px;
            height:52px;
            border-radius:14px;
            background:#f2f2f2;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-shrink:0;
            font-size:1.1rem;
        }

        .item-details{
            min-width:0;
        }

        .item-details h4{
            font-size:1rem;
            font-weight:600;
            margin-bottom:.2rem;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .item-details p{
            font-size:.88rem;
            color:#777;
        }

        .item-price{
            font-size:1rem;
            font-weight:700;
            white-space:nowrap;
        }

        /* FOOTER */

        .order-footer{
            border-top:1px solid #f2f2f2;
            padding:1.4rem 2rem;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:1rem;
            flex-wrap:wrap;
        }

        .order-total{
            font-size:1.35rem;
            font-weight:700;
        }

        /* BUTTONS */

        .order-actions{
            display:flex;
            gap:.8rem;
            flex-wrap:wrap;
        }

        .btn{
            border:none;
            border-radius:12px;
            padding:.8rem 1.3rem;
            font-size:.9rem;
            font-weight:600;
            cursor:pointer;
            transition:.25s ease;
            display:inline-flex;
            align-items:center;
            gap:.5rem;
            font-family:inherit;
        }

        .btn-primary{
            background:#111;
            color:#fff;
        }

        .btn-primary:hover{
            background:#000;
            transform:translateY(-1px);
        }

        .btn-secondary{
            background:#fff;
            border:1px solid #ddd;
            color:#444;
        }

        .btn-secondary:hover{
            background:#f5f5f5;
            border-color:#bbb;
        }

        /* EMPTY */

        .orders-empty{
            background:#fff;
            border:1px solid #ececec;
            border-radius:24px;
            text-align:center;
            padding:5rem 2rem;
        }

        .orders-empty i{
            font-size:4rem;
            color:#ccc;
            margin-bottom:1rem;
        }

        .orders-empty h3{
            font-size:1.8rem;
            margin-bottom:.7rem;
        }

        .orders-empty p{
            color:#888;
            max-width:500px;
            margin:auto;
        }

        /* LOADING */

        .loading{
            text-align:center;
            padding:3rem 1rem;
            color:#666;
        }

        /* ERROR */

        .error-message{
            background:#fff0f0;
            color:#c33;
            padding:1rem 1.2rem;
            border-radius:14px;
            border-left:4px solid #c33;
        }

        /* MOBILE */

        @media (max-width:768px){

            .orders-container{
                padding:110px 1rem 2rem;
            }

            .page-header{
                align-items:flex-start;
            }

            .page-header h1{
                font-size:2rem;
            }

            .orders-stats{
                width:100%;
            }

            .stat-item{
                flex:1;
            }

            .order-header,
            .order-meta,
            .order-items,
            .order-footer{
                padding-left:1.2rem;
                padding-right:1.2rem;
            }

            .order-meta{
                gap:.8rem;
                font-size:.85rem;
            }

            .order-item{
                align-items:flex-start;
            }

            .item-price{
                font-size:.95rem;
            }

            .order-footer{
                flex-direction:column;
                align-items:stretch;
            }

            .order-actions{
                width:100%;
            }

            .btn{
                width:100%;
                justify-content:center;
            }

            .nav-container{
                flex-direction:column;
                gap:1rem;
            }

            .nav-menu{
                justify-content:center;
            }
        }

        /* ANIMATION */

        @keyframes fadeInUp{
            from{
                opacity:0;
                transform:translateY(20px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .fade-in-up{
            animation:fadeInUp .6s ease forwards;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="nav-logo">
                <i class="fas fa-utensils"></i>
                <span>Hulyanas Hill</span>
            </a>
            <ul class="nav-menu">
                <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="menu.html"><i class="fas fa-utensils"></i> Menu</a></li>
                <li><a href="cart.html"><i class="fas fa-shopping-cart"></i> Cart</a></li>
                <li><a href="orders.html"><i class="fas fa-list"></i> Orders</a></li>
                <li><a href="profile.html"><i class="fas fa-user"></i> Profile</a></li>
                <li><a href="#" id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="orders-container">
        <div class="page-header">
            <h1>My Orders</h1>
            <div class="orders-stats">
                <div class="stat-item">
                    <span class="stat-number" id="totalOrders">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="deliveredOrders">0</span>
                    <span class="stat-label">Delivered</span>
                </div>
            </div>
        </div>

        <div class="orders-list" id="ordersList">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading your orders...</p>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
      const API_BASE = window.location.hostname === 'localhost' 
    ? `http://localhost:${window.location.port}`
    : 'https://hulyanas.onrender.com';

        // Get token from localStorage
        function getToken() {
            return localStorage.getItem('token');
        }

        // API Helper
        async function apiRequest(endpoint, options = {}) {
            const token = getToken();
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            const config = {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                },
                ...options
            };

            try {
                const response = await fetch(`${API_BASE}${endpoint}`, config);
                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.removeItem('token');
                        window.location.href = 'login.html';
                        return;
                    }
                    throw new Error(await response.text());
                }
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        // Load orders from database
        async function loadOrders() {
            try {
                const ordersList = document.getElementById('ordersList');
                const totalOrdersEl = document.getElementById('totalOrders');
                const deliveredOrdersEl = document.getElementById('deliveredOrders');

                // Show loading
                ordersList.innerHTML = `
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading your orders...</p>
                    </div>
                `;

                // Fetch orders from database
                const orders = await apiRequest('/api/orders');
                
                if (orders.length === 0) {
                    ordersList.innerHTML = `
                        <div class="orders-empty fade-in-up">
                            <i class="fas fa-list"></i>
                            <h3>No orders yet</h3>
                            <p>Your order history will appear here once you place your first order</p>
                            <a href="menu.html" class="btn btn-primary" style="margin-top: 2rem;">Order Now</a>
                        </div>
                    `;
                    totalOrdersEl.textContent = '0';
                    deliveredOrdersEl.textContent = '0';
                    return;
                }

                // Calculate stats
                const deliveredCount = orders.filter(
                    o => o.status === 'delivered'
                ).length || 0;

                // Render orders
                ordersList.innerHTML = orders.map((order, index) => {
                    const statusClass = `status-${order.status || 'pending'}`;
                    const formattedDate = new Date(order.created_at).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    
                    return `
                        <div class="order-card fade-in-up" style="animation-delay: ${index * 0.1}s">
                            <div class="order-header">
                                <div class="order-number">${order.order_number}</div>
                                <span class="order-status ${statusClass}">${order.status?.replace('_', ' ') || 'Pending'}</span>
                            </div>
                            <div class="order-meta">
                                <span><i class="fas fa-calendar"></i> ${formattedDate}</span>
                                <span><i class="fas fa-map-marker-alt"></i> ${order.delivery_address?.substring(0, 30)}${order.delivery_address?.length > 30 ? '...' : ''}</span>
                                <span><i class="fas fa-phone"></i> ${order.phone}</span>
                            </div>
                            <div class="order-items" data-order-id="${order.id}">
                                <div class="loading" style="padding: 2rem;">
                                    <i class="fas fa-spinner fa-spin"></i>
                                    <p>Loading order items...</p>
                                </div>
                            </div>
                            <div class="order-footer">
                                <div class="order-total">
                                    Total: ₱${Number(order.total_amount || 0).toFixed(2)}
                                </div>
                                <div class="order-actions">
                                    <button class="btn btn-secondary"
                                        onclick='downloadInvoice(
                                            ${order.id},
                                            ${JSON.stringify(order.order_number)},
                                            ${order.total_amount},
                                            ${JSON.stringify(order.status)},
                                            ${JSON.stringify(order.customer_name || "")}
                                        )'>
                                            <i class="fas fa-receipt"></i>
                                            Invoice
                                        </button>
                                    <button class="btn btn-primary" onclick="reorder(${order.id})">
                                        <i class="fas fa-shopping-cart"></i>
                                        Reorder
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                // Update stats
                totalOrdersEl.textContent = orders.length;
                deliveredOrdersEl.textContent = deliveredCount;

                // Load order items for each order
                orders.forEach(order => {
                    loadOrderItems(order.id);
                });

            } catch (error) {
                console.error('Failed to load orders:', error);
                document.getElementById('ordersList').innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i>
                        Failed to load orders. Please try refreshing the page.
                    </div>
                `;
            }
        }

        // Load order items for specific order
        // Replace the existing loadOrderItems function with this:
        async function loadOrderItems(orderId) {
            try {
                const orderItemsContainer = document.querySelector(`[data-order-id="${orderId}"]`);
                const items = await apiRequest(`/api/orders/${orderId}/items`);
                
                if (items.length === 0) {
                    orderItemsContainer.innerHTML = `
                        <div style="padding: 2rem; text-align: center; color: #666;">
                            <i class="fas fa-info-circle"></i>
                            <p>No items in this order</p>
                        </div>
                    `;
                    return;
                }
                
                orderItemsContainer.innerHTML = items.map(item => `
                    <div class="order-item">
                        <div class="item-info">
                            <div class="item-icon" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
                                ${item.image_url ? '' : '🍽️'}
                            </div>
                            <div class="item-details">
                                <h4>${item.name}</h4>
                                <p>${item.quantity}x ₱${parseFloat(item.price_at_order).toFixed(2)}</p>
                            </div>
                        </div>
                        <div class="item-price">₱${(item.quantity * item.price_at_order).toFixed(2)}</div>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Failed to load order items:', error);
            }
        }

        async function showInvoice(orderId, orderNumber, totalAmount) {
            try {
                const items = await apiRequest(`/api/orders/${orderId}/items`);

                let html = `
                    <div style="padding:20px;font-family:Arial">
                        <h2>Invoice - ${orderNumber}</h2>
                        <hr/>
                `;

                items.forEach(i => {
                    html += `
                        <p>
                            ${i.name} - ${i.quantity} x ₱${i.price_at_order}
                            = ₱${(i.quantity * i.price_at_order).toFixed(2)}
                        </p>
                    `;
                });

                html += `
                    <hr/>
                    <h3>Total: ₱${parseFloat(totalAmount).toFixed(2)}</h3>
                    </div>
                `;

                const w = window.open('', '_blank');
                w.document.write(html);
                w.document.close();

            } catch (err) {
                alert('Failed to load invoice');
            }
        }

        async function downloadInvoice(orderId, orderNumber, totalAmount, status, customerName) {
    try {

        if (!window.jspdf) {
            alert("jsPDF not loaded");
            return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF("p", "mm", [220, 80]); // Thermal receipt size

        // =========================
        // SETTINGS
        // =========================
        doc.setFont("courier", "normal");

        const pageWidth = 80;
        let y = 10;

        // =========================
        // LOGO
        // =========================
        const logoUrl = "https://res.cloudinary.com/dta4irg3w/image/upload/v1779012111/hulyanas-logo_nixnhc.png";

        const toDataURL = (url) =>
            fetch(url)
                .then(res => res.blob())
                .then(blob => new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.readAsDataURL(blob);
                }));

        const logoData = await toDataURL(logoUrl);

        // CENTERED LOGO
        doc.addImage(logoData, "PNG", 25, y, 30, 30);
        y += 35;

        // =========================
        // HEADER
        // =========================
        doc.setFontSize(16);
        doc.setFont("courier", "bold");
        doc.text("HULYANAS HILL", pageWidth / 2, y, { align: "center" });

        y += 6;

        doc.setFontSize(9);
        doc.setFont("courier", "normal");
        doc.text("Premium Dining Experience", pageWidth / 2, y, { align: "center" });

        y += 5;

        doc.text("Silago, Southern Leyte", pageWidth / 2, y, { align: "center" });

        y += 5;

        doc.text("+63 961 633 4094", pageWidth / 2, y, { align: "center" });

        y += 4;

        doc.text("facebook.com/hulyanashill", pageWidth / 2, y, { align: "center" });

        y += 6;

        // =========================
        // DIVIDER
        // =========================
        doc.text("================================", pageWidth / 2, y, { align: "center" });

        y += 6;

        // =========================
        // RECEIPT INFO
        // =========================
        doc.setFontSize(9);

        doc.text(`Receipt No : ${orderNumber}`, 5, y);
        y += 5;

        doc.text(`Customer   : ${customerName || "Guest"}`, 5, y);
        y += 5;

        doc.text(`Date       : ${new Date().toLocaleString()}`, 5, y);
        y += 5;

        doc.text(`Status     : ${status.toUpperCase()}`, 5, y);

        y += 6;

        doc.text("--------------------------------", pageWidth / 2, y, { align: "center" });

        y += 6;

        // =========================
        // ITEMS
        // =========================
        const items = await apiRequest(`/api/orders/${orderId}/items`);

        doc.setFont("courier", "bold");
        doc.text("ITEM", 5, y);
        doc.text("QTY", 42, y);
        doc.text("TOTAL", 60, y);

        y += 4;

        doc.text("--------------------------------", pageWidth / 2, y, { align: "center" });

        y += 6;

        doc.setFont("courier", "normal");

        let subtotal = 0;

        items.forEach(item => {

            const qty = Number(item.quantity || 0);
            const price = Number(item.price_at_order || 0);
            const itemTotal = qty * price;

            subtotal += itemTotal;

            // Item Name
            const splitName = doc.splitTextToSize(item.name, 34);

            doc.text(splitName, 5, y);

            doc.text(String(qty), 45, y);

            doc.text(
                `${itemTotal.toFixed(2)}`,
                75,
                y,
                { align: "right" }
            );

            y += splitName.length * 5;
        });

        y += 2;

        doc.text("--------------------------------", pageWidth / 2, y, { align: "center" });

        y += 6;

        // =========================
        // TOTALS
        // =========================
        const vat = subtotal * 0.12;
        const service = subtotal * 0.05;
        const grandTotal = subtotal + vat + service;

        doc.text("Subtotal", 5, y);
        doc.text(`${subtotal.toFixed(2)}`, 75, y, { align: "right" });

        y += 5;

        doc.text("VAT (12%)", 5, y);
        doc.text(`${vat.toFixed(2)}`, 75, y, { align: "right" });

        y += 5;

        doc.text("Service Fee", 5, y);
        doc.text(`${service.toFixed(2)}`, 75, y, { align: "right" });

        y += 6;

        doc.text("================================", pageWidth / 2, y, { align: "center" });

        y += 7;

        doc.setFont("courier", "bold");
        doc.setFontSize(12);

        doc.text("TOTAL", 5, y);
        doc.text(`${grandTotal.toFixed(2)}`, 75, y, { align: "right" });

        y += 10;

        // =========================
        // FOOTER
        // =========================
        doc.setFont("courier", "normal");
        doc.setFontSize(9);

        doc.text("Thank you for dining!", pageWidth / 2, y, { align: "center" });

        y += 5;

        doc.text("Please come again.", pageWidth / 2, y, { align: "center" });

        y += 5;

        doc.text("This serves as your receipt.", pageWidth / 2, y, { align: "center" });

        // =========================
        // SAVE
        // =========================
        doc.save(`receipt-${orderNumber}.pdf`);

    } catch (error) {
        console.error(error);
        alert("Failed to generate invoice PDF");
    }
}

        // Reorder functionality (adds to cart)
        async function reorder(orderId) {
            try {
                // 1. Get order items (USER route)
                const items = await apiRequest(`/api/orders/${orderId}/items`);

                if (!items || items.length === 0) {
                    alert('No items found for reorder');
                    return;
                }

                // 2. Add each item to cart
                for (const item of items) {
                    await apiRequest('/api/cart', {
                        method: 'POST',
                        body: JSON.stringify({
                            menu_item_id: item.menu_item_id || item.id,
                            quantity: item.quantity
                        })
                    });
                }

                alert('Items added to cart! Redirecting...');
                window.location.href = 'cart.html';

            } catch (error) {
                console.error(error);
                alert('Failed to reorder');
            }
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('userName');
                window.location.href = 'login.html';
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Check if user is logged in
            if (!getToken()) {
                window.location.href = 'login.html';
                return;
            }
            loadOrders();
        });

        // Auto-refresh every 30 seconds
        let orderInterval;

        document.addEventListener('DOMContentLoaded', () => {
            if (!getToken()) {
                window.location.href = 'login.html';
                return;
            }

            loadOrders();

            orderInterval = setInterval(loadOrders, 30000);
        });

        window.addEventListener('beforeunload', () => {
            clearInterval(orderInterval);
        });
    </script>
