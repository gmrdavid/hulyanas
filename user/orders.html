<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Hulyanas Hill</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:
        radial-gradient(circle at top left,#1f1f1f 0%,#111 40%,#0a0a0a 100%);
    min-height:100vh;
    color:#fff;
    overflow-x:hidden;
}

/* ================= NAVBAR ================= */

.navbar{
    position:fixed;
    top:0;
    width:100%;
    z-index:1000;
    backdrop-filter:blur(18px);
    background:rgba(15,15,15,0.72);
    border-bottom:1px solid rgba(255,255,255,0.08);
    padding:1rem 0;
}

.nav-container{
    max-width:1300px;
    margin:auto;
    padding:0 2rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.nav-logo{
    display:flex;
    align-items:center;
    gap:.8rem;
    text-decoration:none;
    color:#fff;
    font-size:1.6rem;
    font-weight:700;
}

.nav-logo i{
    font-size:1.8rem;
    color:#ffb347;
}

.nav-menu{
    display:flex;
    align-items:center;
    gap:1rem;
    list-style:none;
}

.nav-menu a{
    color:#d8d8d8;
    text-decoration:none;
    padding:.8rem 1.2rem;
    border-radius:14px;
    transition:.3s ease;
    font-weight:500;
}

.nav-menu a:hover{
    background:rgba(255,255,255,0.08);
    color:#fff;
}

.btn-logout{
    background:linear-gradient(135deg,#ff4d4d,#ff0000) !important;
    color:#fff !important;
    box-shadow:0 10px 25px rgba(255,0,0,.25);
}

.btn-logout:hover{
    transform:translateY(-2px);
}

/* ================= CONTAINER ================= */

.orders-container{
    max-width:1300px;
    margin:auto;
    padding:140px 2rem 3rem;
}

/* ================= HEADER ================= */

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:3rem;
    flex-wrap:wrap;
    gap:1rem;
}

.page-header h1{
    font-size:3rem;
    font-weight:800;
    color:#fff;
    letter-spacing:-1px;
}

.orders-stats{
    display:flex;
    gap:1rem;
}

.stat-item{
    min-width:130px;
    padding:1.3rem;
    border-radius:24px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.08);
    text-align:center;
    box-shadow:
        0 8px 30px rgba(0,0,0,.25);
}

.stat-number{
    font-size:2rem;
    font-weight:800;
    color:#ffcc70;
}

.stat-label{
    color:#bbb;
    font-size:.8rem;
    letter-spacing:1px;
    text-transform:uppercase;
}

/* ================= ORDERS LIST ================= */

.orders-list{
    display:flex;
    flex-direction:column;
    gap:2rem;
}

/* ================= ORDER CARD ================= */

.order-card{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.08),
            rgba(255,255,255,0.03)
        );

    border:1px solid rgba(255,255,255,0.08);
    border-radius:30px;

    overflow:hidden;

    backdrop-filter:blur(18px);

    transition:.4s ease;

    box-shadow:
        0 20px 40px rgba(0,0,0,.35);
}

.order-card:hover{
    transform:translateY(-8px);
    box-shadow:
        0 30px 50px rgba(0,0,0,.45);
}

/* ================= HEADER ================= */

.order-header{
    padding:2rem 2.5rem 1rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:1rem;
}

.order-number{
    font-size:1.4rem;
    font-weight:700;
    color:#fff;
}

/* ================= STATUS ================= */

.order-status{
    padding:.6rem 1.4rem;
    border-radius:50px;
    font-size:.78rem;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
}

.status-pending{
    background:#fff3cd;
    color:#856404;
}

.status-preparing{
    background:#cce5ff;
    color:#004085;
}

.status-out-for-delivery{
    background:#d4edda;
    color:#155724;
}

.status-delivered{
    background:#d1ffd6;
    color:#0f6b2f;
}

.status-cancelled{
    background:#f8d7da;
    color:#721c24;
}

/* ================= META ================= */

.order-meta{
    display:flex;
    gap:1.5rem;
    flex-wrap:wrap;
    padding:0 2.5rem 1.5rem;
    color:#cfcfcf;
    font-size:.92rem;
}

.order-meta span{
    display:flex;
    align-items:center;
    gap:.5rem;
}

/* ================= ITEMS ================= */

.order-items{
    padding:0 2rem 1rem;
}

.order-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:1rem;
    margin-bottom:1rem;

    border-radius:20px;

    background:rgba(255,255,255,0.04);

    transition:.3s ease;
}

.order-item:hover{
    background:rgba(255,255,255,0.07);
}

.item-info{
    display:flex;
    align-items:center;
    gap:1rem;
}

.item-icon{
    width:60px;
    height:60px;
    border-radius:18px;

    background:
        linear-gradient(135deg,#ffb347,#ffcc70);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:1.5rem;
    color:#111;

    box-shadow:
        0 10px 20px rgba(255,179,71,.25);
}

.item-details h4{
    color:#fff;
    margin-bottom:.3rem;
    font-size:1rem;
}

.item-details p{
    color:#bbb;
    font-size:.9rem;
}

.item-price{
    font-size:1.1rem;
    font-weight:700;
    color:#ffcc70;
}

/* ================= FOOTER ================= */

.order-footer{
    padding:1.5rem 2.5rem 2rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:1rem;
}

.order-total{
    font-size:1.7rem;
    font-weight:800;
    color:#fff;
}

/* ================= BUTTONS ================= */

.order-actions{
    display:flex;
    gap:1rem;
}

.btn{
    border:none;
    cursor:pointer;
    border-radius:16px;
    padding:.9rem 1.4rem;
    font-weight:600;
    font-size:.95rem;

    display:flex;
    align-items:center;
    gap:.6rem;

    transition:.3s ease;
}

.btn-primary{
    background:
        linear-gradient(135deg,#ffb347,#ff9500);

    color:#111;

    box-shadow:
        0 12px 25px rgba(255,149,0,.3);
}

.btn-primary:hover{
    transform:translateY(-3px) scale(1.02);
}

.btn-secondary{
    background:rgba(255,255,255,0.08);
    color:#fff;
    border:1px solid rgba(255,255,255,0.08);
}

.btn-secondary:hover{
    background:rgba(255,255,255,0.14);
    transform:translateY(-2px);
}

/* ================= EMPTY ================= */

.orders-empty{
    padding:6rem 2rem;
    border-radius:30px;

    background:rgba(255,255,255,0.06);

    text-align:center;

    border:1px solid rgba(255,255,255,0.08);
}

.orders-empty i{
    font-size:5rem;
    margin-bottom:1.5rem;
    color:#ffcc70;
}

.orders-empty h3{
    font-size:2rem;
    margin-bottom:.8rem;
}

.orders-empty p{
    color:#bbb;
}

/* ================= LOADING ================= */

.loading{
    text-align:center;
    padding:4rem;
    color:#ccc;
}

/* ================= ANIMATIONS ================= */

@keyframes fadeInUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.fade-in-up{
    animation:fadeInUp .6s ease forwards;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

    .nav-menu{
        gap:.3rem;
    }

    .nav-menu a{
        padding:.7rem;
        font-size:.8rem;
    }

    .page-header{
        flex-direction:column;
        align-items:flex-start;
    }

    .page-header h1{
        font-size:2.3rem;
    }

    .orders-stats{
        width:100%;
    }

    .stat-item{
        flex:1;
    }

    .order-header,
    .order-footer{
        flex-direction:column;
        align-items:flex-start;
    }

    .order-actions{
        width:100%;
        flex-direction:column;
    }

    .btn{
        width:100%;
        justify-content:center;
    }

    .order-item{
        flex-direction:column;
        align-items:flex-start;
        gap:1rem;
    }

    .item-price{
        width:100%;
        text-align:right;
    }
}
</style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="nav-logo">
                <i class="fas fa-utensils"></i>
                <span>Hulyanas Hill</span>
            </a>
            <ul class="nav-menu">
                <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="menu.html"><i class="fas fa-utensils"></i> Menu</a></li>
                <li><a href="cart.html"><i class="fas fa-shopping-cart"></i> Cart</a></li>
                <li><a href="orders.html"><i class="fas fa-list"></i> Orders</a></li>
                <li><a href="profile.html"><i class="fas fa-user"></i> Profile</a></li>
                <li><a href="#" id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="orders-container">
        <div class="page-header">
            <h1>My Orders</h1>
            <div class="orders-stats">
                <div class="stat-item">
                    <span class="stat-number" id="totalOrders">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="deliveredOrders">0</span>
                    <span class="stat-label">Delivered</span>
                </div>
            </div>
        </div>

        <div class="orders-list" id="ordersList">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading your orders...</p>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
      const API_BASE = window.location.hostname === 'localhost' 
    ? `http://localhost:${window.location.port}`
    : 'https://hulyanas.onrender.com';

        // Get token from localStorage
        function getToken() {
            return localStorage.getItem('token');
        }

        // API Helper
        async function apiRequest(endpoint, options = {}) {
            const token = getToken();
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            const config = {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                },
                ...options
            };

            try {
                const response = await fetch(`${API_BASE}${endpoint}`, config);
                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.removeItem('token');
                        window.location.href = 'login.html';
                        return;
                    }
                    throw new Error(await response.text());
                }
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        // Load orders from database
        async function loadOrders() {
            try {
                const ordersList = document.getElementById('ordersList');
                const totalOrdersEl = document.getElementById('totalOrders');
                const deliveredOrdersEl = document.getElementById('deliveredOrders');

                // Show loading
                ordersList.innerHTML = `
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading your orders...</p>
                    </div>
                `;

                // Fetch orders from database
                const orders = await apiRequest('/api/orders');
                
                if (orders.length === 0) {
                    ordersList.innerHTML = `
                        <div class="orders-empty fade-in-up">
                            <i class="fas fa-list"></i>
                            <h3>No orders yet</h3>
                            <p>Your order history will appear here once you place your first order</p>
                            <a href="menu.html" class="btn btn-primary" style="margin-top: 2rem;">Order Now</a>
                        </div>
                    `;
                    totalOrdersEl.textContent = '0';
                    deliveredOrdersEl.textContent = '0';
                    return;
                }

                // Calculate stats
                const deliveredCount = orders.filter(
                    o => o.status === 'delivered'
                ).length || 0;

                // Render orders
                ordersList.innerHTML = orders.map((order, index) => {
                    const statusClass = `status-${order.status || 'pending'}`;
                    const formattedDate = new Date(order.created_at).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    
                    return `
                        <div class="order-card fade-in-up" style="animation-delay: ${index * 0.1}s">
                            <div class="order-header">
                                <div class="order-number">${order.order_number}</div>
                                <span class="order-status ${statusClass}">${order.status?.replace('_', ' ') || 'Pending'}</span>
                            </div>
                            <div class="order-meta">
                                <span><i class="fas fa-calendar"></i> ${formattedDate}</span>
                                <span><i class="fas fa-map-marker-alt"></i> ${order.delivery_address?.substring(0, 30)}${order.delivery_address?.length > 30 ? '...' : ''}</span>
                                <span><i class="fas fa-phone"></i> ${order.phone}</span>
                            </div>
                            <div class="order-items" data-order-id="${order.id}">
                                <div class="loading" style="padding: 2rem;">
                                    <i class="fas fa-spinner fa-spin"></i>
                                    <p>Loading order items...</p>
                                </div>
                            </div>
                            <div class="order-footer">
                                <div class="order-total">
                                    Total: ₱${Number(order.total_amount || 0).toFixed(2)}
                                </div>
                                <div class="order-actions">
                                    <button class="btn btn-secondary"
                                        onclick='downloadInvoice(
                                            ${order.id},
                                            ${JSON.stringify(order.order_number)},
                                            ${order.total_amount},
                                            ${JSON.stringify(order.status)},
                                            ${JSON.stringify(order.customer_name || "")}
                                        )'>
                                            <i class="fas fa-receipt"></i>
                                            Invoice
                                        </button>
                                    <button class="btn btn-primary" onclick="reorder(${order.id})">
                                        <i class="fas fa-shopping-cart"></i>
                                        Reorder
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                // Update stats
                totalOrdersEl.textContent = orders.length;
                deliveredOrdersEl.textContent = deliveredCount;

                // Load order items for each order
                orders.forEach(order => {
                    loadOrderItems(order.id);
                });

            } catch (error) {
                console.error('Failed to load orders:', error);
                document.getElementById('ordersList').innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i>
                        Failed to load orders. Please try refreshing the page.
                    </div>
                `;
            }
        }

        // Load order items for specific order
        // Replace the existing loadOrderItems function with this:
        async function loadOrderItems(orderId) {
            try {
                const orderItemsContainer = document.querySelector(`[data-order-id="${orderId}"]`);
                const items = await apiRequest(`/api/orders/${orderId}/items`);
                
                if (items.length === 0) {
                    orderItemsContainer.innerHTML = `
                        <div style="padding: 2rem; text-align: center; color: #666;">
                            <i class="fas fa-info-circle"></i>
                            <p>No items in this order</p>
                        </div>
                    `;
                    return;
                }
                
                orderItemsContainer.innerHTML = items.map(item => `
                    <div class="order-item">
                        <div class="item-info">
                            <div class="item-icon" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
                                ${item.image_url ? '' : '🍽️'}
                            </div>
                            <div class="item-details">
                                <h4>${item.name}</h4>
                                <p>${item.quantity}x ₱${parseFloat(item.price_at_order).toFixed(2)}</p>
                            </div>
                        </div>
                        <div class="item-price">₱${(item.quantity * item.price_at_order).toFixed(2)}</div>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Failed to load order items:', error);
            }
        }

        async function showInvoice(orderId, orderNumber, totalAmount) {
            try {
                const items = await apiRequest(`/api/orders/${orderId}/items`);

                let html = `
                    <div style="padding:20px;font-family:Arial">
                        <h2>Invoice - ${orderNumber}</h2>
                        <hr/>
                `;

                items.forEach(i => {
                    html += `
                        <p>
                            ${i.name} - ${i.quantity} x ₱${i.price_at_order}
                            = ₱${(i.quantity * i.price_at_order).toFixed(2)}
                        </p>
                    `;
                });

                html += `
                    <hr/>
                    <h3>Total: ₱${parseFloat(totalAmount).toFixed(2)}</h3>
                    </div>
                `;

                const w = window.open('', '_blank');
                w.document.write(html);
                w.document.close();

            } catch (err) {
                alert('Failed to load invoice');
            }
        }

        async function downloadInvoice(orderId, orderNumber, totalAmount, status, customerName) {
    try {

        if (!window.jspdf) {
            alert("jsPDF not loaded");
            return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF("p", "mm", [220, 80]); // Thermal receipt size

        // =========================
        // SETTINGS
        // =========================
        doc.setFont("courier", "normal");

        const pageWidth = 80;
        let y = 10;

        // =========================
        // LOGO
        // =========================
        const logoUrl = "https://res.cloudinary.com/dta4irg3w/image/upload/v1779012111/hulyanas-logo_nixnhc.png";

        const toDataURL = (url) =>
            fetch(url)
                .then(res => res.blob())
                .then(blob => new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.readAsDataURL(blob);
                }));

        const logoData = await toDataURL(logoUrl);

        // CENTERED LOGO
        doc.addImage(logoData, "PNG", 25, y, 30, 30);
        y += 35;

        // =========================
        // HEADER
        // =========================
        doc.setFontSize(16);
        doc.setFont("courier", "bold");
        doc.text("HULYANAS HILL", pageWidth / 2, y, { align: "center" });

        y += 6;

        doc.setFontSize(9);
        doc.setFont("courier", "normal");
        doc.text("Premium Dining Experience", pageWidth / 2, y, { align: "center" });

        y += 5;

        doc.text("Silago, Southern Leyte", pageWidth / 2, y, { align: "center" });

        y += 5;

        doc.text("+63 961 633 4094", pageWidth / 2, y, { align: "center" });

        y += 4;

        doc.text("facebook.com/hulyanashill", pageWidth / 2, y, { align: "center" });

        y += 6;

        // =========================
        // DIVIDER
        // =========================
        doc.text("================================", pageWidth / 2, y, { align: "center" });

        y += 6;

        // =========================
        // RECEIPT INFO
        // =========================
        doc.setFontSize(9);

        doc.text(`Receipt No : ${orderNumber}`, 5, y);
        y += 5;

        doc.text(`Customer   : ${customerName || "Guest"}`, 5, y);
        y += 5;

        doc.text(`Date       : ${new Date().toLocaleString()}`, 5, y);
        y += 5;

        doc.text(`Status     : ${status.toUpperCase()}`, 5, y);

        y += 6;

        doc.text("--------------------------------", pageWidth / 2, y, { align: "center" });

        y += 6;

        // =========================
        // ITEMS
        // =========================
        const items = await apiRequest(`/api/orders/${orderId}/items`);

        doc.setFont("courier", "bold");
        doc.text("ITEM", 5, y);
        doc.text("QTY", 42, y);
        doc.text("TOTAL", 60, y);

        y += 4;

        doc.text("--------------------------------", pageWidth / 2, y, { align: "center" });

        y += 6;

        doc.setFont("courier", "normal");

        let subtotal = 0;

        items.forEach(item => {

            const qty = Number(item.quantity || 0);
            const price = Number(item.price_at_order || 0);
            const itemTotal = qty * price;

            subtotal += itemTotal;

            // Item Name
            const splitName = doc.splitTextToSize(item.name, 34);

            doc.text(splitName, 5, y);

            doc.text(String(qty), 45, y);

            doc.text(
                `${itemTotal.toFixed(2)}`,
                75,
                y,
                { align: "right" }
            );

            y += splitName.length * 5;
        });

        y += 2;

        doc.text("--------------------------------", pageWidth / 2, y, { align: "center" });

        y += 6;

        // =========================
        // TOTALS
        // =========================
        const vat = subtotal * 0.12;
        const service = subtotal * 0.05;
        const grandTotal = subtotal + vat + service;

        doc.text("Subtotal", 5, y);
        doc.text(`${subtotal.toFixed(2)}`, 75, y, { align: "right" });

        y += 5;

        doc.text("VAT (12%)", 5, y);
        doc.text(`${vat.toFixed(2)}`, 75, y, { align: "right" });

        y += 5;

        doc.text("Service Fee", 5, y);
        doc.text(`${service.toFixed(2)}`, 75, y, { align: "right" });

        y += 6;

        doc.text("================================", pageWidth / 2, y, { align: "center" });

        y += 7;

        doc.setFont("courier", "bold");
        doc.setFontSize(12);

        doc.text("TOTAL", 5, y);
        doc.text(`${grandTotal.toFixed(2)}`, 75, y, { align: "right" });

        y += 10;

        // =========================
        // FOOTER
        // =========================
        doc.setFont("courier", "normal");
        doc.setFontSize(9);

        doc.text("Thank you for dining!", pageWidth / 2, y, { align: "center" });

        y += 5;

        doc.text("Please come again.", pageWidth / 2, y, { align: "center" });

        y += 5;

        doc.text("This serves as your receipt.", pageWidth / 2, y, { align: "center" });

        // =========================
        // SAVE
        // =========================
        doc.save(`receipt-${orderNumber}.pdf`);

    } catch (error) {
        console.error(error);
        alert("Failed to generate invoice PDF");
    }
}

        // Reorder functionality (adds to cart)
        async function reorder(orderId) {
            try {
                // 1. Get order items (USER route)
                const items = await apiRequest(`/api/orders/${orderId}/items`);

                if (!items || items.length === 0) {
                    alert('No items found for reorder');
                    return;
                }

                // 2. Add each item to cart
                for (const item of items) {
                    await apiRequest('/api/cart', {
                        method: 'POST',
                        body: JSON.stringify({
                            menu_item_id: item.menu_item_id || item.id,
                            quantity: item.quantity
                        })
                    });
                }

                alert('Items added to cart! Redirecting...');
                window.location.href = 'cart.html';

            } catch (error) {
                console.error(error);
                alert('Failed to reorder');
            }
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('userName');
                window.location.href = 'login.html';
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Check if user is logged in
            if (!getToken()) {
                window.location.href = 'login.html';
                return;
            }
            loadOrders();
        });

        // Auto-refresh every 30 seconds
        let orderInterval;

        document.addEventListener('DOMContentLoaded', () => {
            if (!getToken()) {
                window.location.href = 'login.html';
                return;
            }

            loadOrders();

            orderInterval = setInterval(loadOrders, 30000);
        });

        window.addEventListener('beforeunload', () => {
            clearInterval(orderInterval);
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</body>
